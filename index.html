<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Functional Path Tracker</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --success-color: #22c55e;
            --warning-color: #fbbf24;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            padding-bottom: 40px;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 { margin: 0; font-size: 1.4rem; color: var(--accent-color); }
        
        .stats-panel {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-around;
            text-align: center;
        }

        .stat-box { flex: 1; }
        .stat-num { font-size: 1.4rem; font-weight: bold; color: var(--accent-color); }
        .stat-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-top: 2px;}

        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 15px;
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            padding: 6px 0;
            z-index: 10;
        }

        .tab-btn {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px 4px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--accent-color);
            color: var(--bg-color);
            border-color: var(--accent-color);
        }

        .workout-section { display: none; }
        .workout-section.active { display: block; }

        .exercise-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .exercise-title { font-size: 1rem; font-weight: bold; margin: 0; }
        
        .meta-row {
            display: flex;
            gap: 6px;
            margin-top: 4px;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 0.7rem;
            background: var(--border-color);
            color: var(--text-main);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .target-tag { color: var(--accent-color); font-weight: bold; background: rgba(56, 189, 248, 0.1); }
        .rep-tag { color: var(--warning-color); font-weight: bold; background: rgba(251, 191, 36, 0.1); }

        .info-toggle {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 0.8rem;
            cursor: pointer;
        }

        .exercise-info {
            display: none;
            font-size: 0.8rem;
            color: var(--text-muted);
            background: rgba(0,0,0,0.2);
            padding: 8px;
            border-radius: 6px;
            margin: 8px 0;
        }

        .log-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        .log-table th { font-size: 0.75rem; color: var(--text-muted); text-align: left; padding-bottom: 4px; }
        .log-row td { padding: 4px 0; vertical-align: middle; }
        .set-num { font-weight: bold; color: var(--text-muted); width: 10%; font-size: 0.85rem;}
        .input-cell { width: 35%; padding-right: 6px; }
        
        .log-input {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px;
            border-radius: 6px;
            box-sizing: border-box;
            text-align: center;
            font-size: 0.9rem;
        }

        .log-input:focus { border-color: var(--accent-color); outline: none; }
        .done-btn {
            background: var(--border-color);
            border: none;
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }
        .done-btn.checked { background: var(--success-color); color: white; }

        .finish-container { margin: 20px 0; }
        .finish-btn {
            width: 100%;
            background: var(--success-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .history-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            margin-top: 15px;
        }
        .history-section h3 { margin-top: 0; color: var(--accent-color); font-size: 1rem; }
        .history-item {
            border-bottom: 1px solid var(--border-color);
            padding: 8px 0;
            font-size: 0.8rem;
        }
        .history-item:last-child { border-bottom: none; }
        .history-date { font-weight: bold; color: var(--text-main); }
        .history-details { color: var(--text-muted); margin-top: 2px; font-family: monospace; white-space: pre-wrap; }

        /* Backup Utilities System styling */
        .backup-controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed var(--border-color);
        }
        .btn-backup {
            flex: 1;
            background: var(--border-color);
            color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .btn-danger { background: none; border: none; color: #ef4444; font-size: 0.75rem; cursor: pointer; padding: 0; margin-top: 15px; display: block;}
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-color);
            color: var(--bg-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            display: none;
            z-index: 100;
        }
    </style>
</head>
<body>

    <header>
        <h1>Functional Path Tracker</h1>
    </header>

    <div class="stats-panel">
        <div class="stat-box">
            <div id="stat-count" class="stat-num">0</div>
            <div class="stat-label">Workouts</div>
        </div>
        <div class="stat-box" style="border-left: 1px solid var(--border-color); border-right: 1px solid var(--border-color);">
            <div id="stat-last-type" class="stat-num">-</div>
            <div class="stat-label">Last Done</div>
        </div>
        <div class="stat-box">
            <div id="stat-date" class="stat-num">--/--</div>
            <div class="stat-label">Last Date</div>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchWorkout('workout-a')">A: Push/Pull</button>
        <button class="tab-btn" onclick="switchWorkout('workout-b')">B: Hinge/Mobility</button>
        <button class="tab-btn" onclick="switchWorkout('workout-c')">C: Rotation</button>
        <button class="tab-btn" onclick="switchWorkout('view-history')">📜 History</button>
    </div>

    <div id="workout-a" class="workout-section active"></div>
    <div id="workout-b" class="workout-section"></div>
    <div id="workout-c" class="workout-section"></div>

    <div id="view-history" class="workout-section">
        <div class="history-section">
            <h3>Logged Training History</h3>
            <div id="history-stream">No training sessions recorded yet. Complete a session to track metrics!</div>
            
            <div class="backup-controls">
                <button class="btn-backup" onclick="exportDataData()">📤 Export Backup File</button>
                <label class="btn-backup" style="display: inline-block;">
                    📥 Import Backup File
                    <input type="file" id="import-trigger" accept=".json" onchange="importDataData(event)" style="display: none;">
                </label>
            </div>

            <button class="btn-danger" onclick="resetAllHistory()">⚠️ Wipe App Data</button>
        </div>
    </div>

    <div id="footer-actions" class="finish-container">
        <button class="finish-btn" onclick="finishWorkout()">✓ Complete Workout & Save Stats</button>
    </div>

    <div class="toast" id="toast">Saved!</div>

    <script>
        const routines = {
            'workout-a': {
                name: 'Workout A',
                exercises: [
                    { id: 'a1', name: '1. Goblet Squat or Box Squat', target: 'Legs & Core', sets: 3, reps: '8-10 Reps', note: 'Hold weight at chest level. Keep torso upright. Sit deep down to stretch your hips and build real-world moving power.', unit: 'lbs/kg' },
                    { id: 'a2', name: '2. Lat Pulldown / Assisted Pull-up', target: 'Upper Back', sets: 3, reps: '10-12 Reps', note: 'Pull bar down to your chest. Consciously pull shoulder blades down. Acts directly to straighten a hunched back.', unit: 'lbs/kg' },
                    { id: 'a3', name: '3. Dumbbell Bench Press', target: 'Chest & Arms', sets: 3, reps: '8-10 Reps', note: 'Press dumbbells straight up from a flat bench. Safer path of motion for shoulders; prevents stronger arm dominance.', unit: 'lbs/kg' },
                    { id: 'a4', name: '4. Cable Face Pulls', target: 'Rear Delts / Alignment', sets: 3, reps: '15 Reps', note: 'Pull cable rope toward your forehead, flaring your hands out wide at the end. Fixes rolling desk shoulders.', unit: 'lbs/kg' },
                    { id: 'a5', name: '5. RKC Plank or Dead Bug', target: 'Deep Core Stabilization', sets: 3, reps: '30 Sec Hold', note: 'Squeeze glutes, abs, and thighs like iron. Pulls stomach wall inward to correct sitting posture mechanics.', unit: 'Secs' }
                ]
            },
            'workout-b': {
                name: 'Workout B',
                exercises: [
                    { id: 'b1', name: '1. Romanian Deadlift (DB or Barbell)', target: 'Hamstrings & Glutes', sets: 3, reps: '8-10 Reps', note: 'Push hips backward while maintaining a perfectly flat upper spine. Wakes up the glutes after hours of sitting down.', unit: 'lbs/kg' },
                    { id: 'b2', name: '2. Seated Cable Row (Wide Grip)', target: 'Mid-Spine Traps', sets: 3, reps: '10-12 Reps', note: 'Sit proud. Pull the handles to lower rib boundary. Intentionally pin shoulder blades tightly together to reverse slouching.', unit: 'lbs/kg' },
                    { id: 'b3', name: '3. DB Overhead Shoulder Press', target: 'Shoulders / Vertical', sets: 3, reps: '8 Reps', note: 'Press dumbbells up vertically. Pull ribs down to prevent leaning back excessively. Protects neck joints.', unit: 'lbs/kg' },
                    { id: 'b4', name: '4. Bulgarian Split Squat / Reverse Lunge', target: 'Single-Leg Balance', sets: 3, reps: '8 Reps/Leg', note: 'Step rear leg backward onto a box/bench. Unlocks intense hip flexor stiffness while correcting limb imbalances.', unit: 'lbs/kg' },
                    { id: 'b5', name: '5. Farmer’s Walks / Dumbbell Carries', target: 'Grip & Total Body Stability', sets: 3, reps: '40 Meters', note: 'Grab heavy dumbbells in each hand. Walk perfectly tall with an active spine. Bulletproofs the core layout.', unit: 'lbs/kg' }
                ]
            },
            'workout-c': {
                name: 'Workout C',
                exercises: [
                    { id: 'c1', name: '1. Leg Press or Hack Squat', target: 'Quad Development', sets: 3, reps: '10 Reps', note: 'Keep feet securely planted. Highers weight deep to stimulate leg muscles safely without fatiguing lower back structure.', unit: 'lbs/kg' },
                    { id: 'c2', name: '2. Chest-Supported DB Row', target: 'Isolated Mid-Back', sets: 3, reps: '10 Reps', note: 'Lie chest-down on incline bench surface. Pull weights up with elbows high. Eliminates cheating to focus entirely on upper spine.', unit: 'lbs/kg' },
                    { id: 'c3', name: '3. Incline Dumbbell Press', target: 'Upper Chest Boundary', sets: 3, reps: '10 Reps', note: 'Set bench angle precisely to 30 degrees. Expands your chest to offset slouching structures.', unit: 'lbs/kg' },
                    { id: 'c4', name: '4. Cable Woodchoppers', target: 'Rotational Core Core', sets: 3, reps: '12 Reps/Side', note: 'Pull cable down diagonally across knee path using core rotation. Essential cross-body athleticism for healthy longevity.', unit: 'lbs/kg' },
                    { id: 'c5', name: '5. Hanging Knee Raises', target: 'Lower Core Ab Wall', sets: 3, reps: '12 Reps', note: 'Tuck knees to chest. Rotates hips into neutral tracking to mechanically pull lower stomach fat/organs tight and inward.', unit: 'Reps' }
                ]
            }
        };

        let activeTabId = 'workout-a';

        function renderApp() {
            for (const [dayId, data] of Object.entries(routines)) {
                const container = document.getElementById(dayId);
                let html = '';

                data.exercises.forEach(ex => {
                    html += `
                        <div class="exercise-card">
                            <div class="exercise-header">
                                <div>
                                    <h2 class="exercise-title">${ex.name}</h2>
                                    <div class="meta-row">
                                        <span class="tag target-tag">${ex.target}</span>
                                        <span class="tag rep-tag">🎯 Target: ${ex.reps}</span>
                                    </div>
                                </div>
                                <button class="info-toggle" onclick="toggleInfo('${ex.id}')">ℹ️ How-To</button>
                            </div>
                            
                            <div class="exercise-info" id="info-${ex.id}">${ex.note}</div>

                            <table class="log-table">
                                <thead>
                                    <tr>
                                        <th>Set</th>
                                        <th>${ex.unit}</th>
                                        <th>Actual Reps</th>
                                        <th style="text-align:right">Log</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;

                    for (let s = 1; s <= ex.sets; s++) {
                        const weightKey = `cur-${ex.id}-w-${s}`;
                        const repKey = `cur-${ex.id}-r-${s}`;
                        const checkKey = `cur-${ex.id}-c-${s}`;

                        const wVal = localStorage.getItem(weightKey) || '';
                        const rVal = localStorage.getItem(repKey) || '';
                        const isChecked = localStorage.getItem(checkKey) === 'true' ? 'checked' : '';

                        html += `
                            <tr class="log-row">
                                <td class="set-num">${s}</td>
                                <td class="input-cell">
                                    <input type="text" pattern="[0-9]*" inputmode="decimal" id="${weightKey}" class="log-input" placeholder="Weight" value="${wVal}" oninput="saveCurrentLive('${weightKey}', this.value)">
                                </td>
                                <td class="input-cell">
                                    <input type="number" pattern="[0-9]*" inputmode="numeric" id="${repKey}" class="log-input" placeholder="Reps" value="${rVal}" oninput="saveCurrentLive('${repKey}', this.value)">
                                </td>
                                <td class="check-cell" style="text-align:right">
                                    <button id="${checkKey}" class="done-btn ${isChecked}" onclick="toggleSetCheck('${checkKey}')">✓</button>
                                </td>
                            </tr>
                        `;
                    }
                    html += `</tbody></table></div>`;
                });
                container.innerHTML = html;
            }
            updateDashboardStats();
            renderHistoryLog();
        }

        function switchWorkout(dayId) {
            activeTabId = dayId;
            document.querySelectorAll('.workout-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(dayId).classList.add('active');
            event.currentTarget.classList.add('active');

            const footerBtn = document.getElementById('footer-actions');
            footerBtn.style.display = (dayId === 'view-history') ? 'none' : 'block';
            window.scrollTo({top: 0});
        }

        function toggleInfo(id) {
            const el = document.getElementById(`info-${id}`);
            el.style.display = (el.style.display === 'block') ? 'none' : 'block';
        }

        function saveCurrentLive(key, val) {
            localStorage.setItem(key, val);
        }

        function toggleSetCheck(key) {
            const btn = document.getElementById(key);
            const isChecked = btn.classList.toggle('checked');
            localStorage.setItem(key, isChecked);
            
            const toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 600);
        }

        function finishWorkout() {
            const currentRoutine = routines[activeTabId];
            if (!currentRoutine) return;

            let logDetails = '';
            let exercisesLogCount = 0;

            currentRoutine.exercises.forEach(ex => {
                let exLines = [];
                for (let s = 1; s <= ex.sets; s++) {
                    const weight = localStorage.getItem(`cur-${ex.id}-w-${s}`) || '0';
                    const reps = localStorage.getItem(`cur-${ex.id}-r-${s}`) || '0';
                    const checked = localStorage.getItem(`cur-${ex.id}-c-${s}`) === 'true';
                    
                    if (checked || weight !== '0' || reps !== '0') {
                        exLines.push(`  Set ${s}: ${weight} x ${reps} reps`);
                    }
                }
                if (exLines.length > 0) {
                    logDetails += `${ex.name}\n${exLines.join('\n')}\n`;
                    exercisesLogCount++;
                }
            });

            if (exercisesLogCount === 0) {
                alert("Please log at least one completed set before finalizing your workout session!");
                return;
            }

            const today = new Date();
            const dateString = today.toLocaleDateString(undefined, {month: 'short', day: 'numeric', year: 'numeric'});

            const sessionRecord = {
                date: dateString,
                type: currentRoutine.name,
                details: logDetails.trim()
            };

            let historyList = JSON.parse(localStorage.getItem('gym_history_stream')) || [];
            historyList.unshift(sessionRecord);
            localStorage.setItem('gym_history_stream', JSON.stringify(historyList));

            localStorage.setItem('stat_total_count', historyList.length);
            localStorage.setItem('stat_last_type', currentRoutine.name);
            localStorage.setItem('stat_last_date', today.toLocaleDateString(undefined, {month: '2-digit', day: '2-digit'}));

            currentRoutine.exercises.forEach(ex => {
                for (let s = 1; s <= ex.sets; s++) {
                    localStorage.removeItem(`cur-${ex.id}-w-${s}`);
                    localStorage.removeItem(`cur-${ex.id}-r-${s}`);
                    localStorage.removeItem(`cur-${ex.id}-c-${s}`);
                }
            });

            alert(`Awesome job! ${currentRoutine.name} has been successfully logged.`);
            renderApp();
            switchWorkout('view-history');
        }

        function updateDashboardStats() {
            document.getElementById('stat-count').innerText = localStorage.getItem('stat_total_count') || '0';
            document.getElementById('stat-last-type').innerText = localStorage.getItem('stat_last_type') || '-';
            document.getElementById('stat-date').innerText = localStorage.getItem('stat_last_date') || '--/--';
        }

        function renderHistoryLog() {
            const historyStream = document.getElementById('history-stream');
            const historyList = JSON.parse(localStorage.getItem('gym_history_stream')) || [];

            if (historyList.length === 0) {
                historyStream.innerHTML = "No training sessions recorded yet. Complete a session to track metrics!";
                return;
            }

            let html = '';
            historyList.forEach(item => {
                html += `
                    <div class="history-item">
                        <span class="history-date">${item.date}</span> - <span style="color: var(--accent-color); font-weight:bold;">${item.type}</span>
                        <div class="history-details">${item.details}</div>
                    </div>
                `;
            });
            historyStream.innerHTML = html;
        }

        // Export System Module
        function exportDataData() {
            const stateData = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                stateData[key] = localStorage.getItem(key);
            }
            
            if (Object.keys(stateData).length === 0) {
                alert("No training history exists to export yet!");
                return;
            }

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(stateData));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `gym_tracker_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // Import System Module
        function importDataData(event) {
            const fileElement = event.target.files[0];
            if (!fileElement) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (confirm("Importing backup will merge or overwrite current device data. Proceed?")) {
                        Object.keys(parsed).forEach(k => {
                            localStorage.setItem(k, parsed[k]);
                        });
                        alert("Data backup successfully restored!");
                        renderApp();
                    }
                } catch (err) {
                    alert("Error processing backup file. Ensure it is a valid backup file generated by this app.");
                }
            };
            reader.readAsText(fileElement);
        }

        function resetAllHistory() {
            if (confirm("Are you absolutely sure you want to delete your entire training history and all stats? This cannot be undone.")) {
                localStorage.clear();
                renderApp();
            }
        }

        renderApp();
    </script>
</body>
</html>
