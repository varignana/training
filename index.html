<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Functional Path Analytics v4</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151f32;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --border-color: #22314d;
            --success-color: #10b981;
            --warning-color: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            padding-bottom: 60px;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 { margin: 0; font-size: 1.1rem; color: var(--accent-color); }

        .bodyweight-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--card-bg);
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .bodyweight-box input {
            width: 50px;
            background: transparent;
            border: none;
            color: var(--warning-color);
            font-weight: bold;
            font-size: 0.9rem;
            text-align: center;
            outline: none;
        }

        /* Session Initialization Screen Gate */
        .session-gate-panel {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px dashed var(--accent-color);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 15px;
        }
        .start-session-btn {
            background: var(--accent-color);
            color: var(--bg-color);
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .global-timer-display {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--warning-color);
            background: rgba(245, 158, 11, 0.1);
            padding: 4px 10px;
            border-radius: 6px;
            font-family: monospace;
        }

        /* Analytics Dashboard View Panels */
        .stats-panel {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-around;
            text-align: center;
        }
        .stat-box { flex: 1; }
        .stat-num { font-size: 1.1rem; font-weight: bold; color: var(--accent-color); }
        .stat-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; margin-top: 2px;}

        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 15px;
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            padding: 6px 0;
            z-index: 10;
        }
        .tab-btn {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px 4px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .tab-btn.active {
            background: var(--accent-color);
            color: var(--bg-color);
            border-color: var(--accent-color);
        }

        .workout-section { display: none; }
        .workout-section.active { display: block; }

        /* Exercise Deck Layout Card Blocks */
        .exercise-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            position: relative;
        }
        .exercise-card.completed-block {
            opacity: 0.5;
            border-color: var(--success-color);
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 4px;
        }
        .exercise-title { font-size: 0.95rem; font-weight: bold; margin: 0; padding-right: 75px; }
        
        .ex-timer-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 0.7rem;
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent-color);
            padding: 3px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-weight: bold;
        }

        .close-ex-btn {
            background: #1e293b;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            font-size: 0.65rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 8px;
        }
        .close-ex-btn.frozen {
            background: var(--success-color);
            color: white;
            border-color: var(--success-color);
        }

        .tag {
            font-size: 0.65rem;
            background: rgba(255,255,255,0.04);
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 8px;
        }

        .log-table { width: 100%; border-collapse: collapse; }
        .log-table th { font-size: 0.65rem; color: var(--text-muted); text-align: left; padding-bottom: 6px; text-transform: uppercase;}
        .log-row { border-bottom: 1px solid rgba(255,255,255,0.03); }
        .log-row td { padding: 6px 0; vertical-align: middle; }
        
        .set-num { font-weight: bold; color: var(--text-muted); width: 8%; font-size: 0.8rem;}
        .input-cell { width: 26%; padding-right: 6px; }
        
        .log-input {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 4px;
            border-radius: 6px;
            box-sizing: border-box;
            text-align: center;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .log-input:disabled { opacity: 0.3; }

        .stopwatch-btn {
            width: 100%;
            background: #1e293b;
            border: 1px solid var(--border-color);
            color: var(--warning-color);
            padding: 8px 2px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
        }
        .stopwatch-btn.running { background: #ef4444; color: white; }

        .target-cell { width: 40%; font-size: 0.72rem; color: var(--text-muted); padding-left: 4px; line-height: 1.2; }
        .target-cell strong { color: var(--accent-color); }
        .target-cell span { color: var(--warning-color); display: block; font-size: 0.62rem; margin-top: 1px;}

        .finish-container { margin: 20px 0; display: none; }
        .finish-btn {
            width: 100%;
            background: var(--success-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        /* Analytics History Engine Styles */
        .analytics-block {
            background: #111827;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 12px;
            font-size: 0.75rem;
        }
        .analytics-title { color: var(--accent-color); font-weight: bold; font-size: 0.85rem; margin-bottom: 4px; }

        .history-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            margin-top: 15px;
        }
        .history-section h3 { margin-top: 0; color: var(--accent-color); font-size: 1rem; }
        .history-item {
            border-bottom: 1px solid var(--border-color);
            padding: 8px 0;
            font-size: 0.8rem;
        }
        .history-item:last-child { border-bottom: none; }
        .history-date { font-weight: bold; color: var(--text-main); }
        .history-details { color: var(--text-muted); margin-top: 4px; font-family: monospace; white-space: pre-wrap; line-height: 1.3;}

        .backup-controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed var(--border-color);
        }
        .btn-backup {
            flex: 1;
            background: var(--border-color);
            color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .btn-danger { background: none; border: none; color: #ef4444; font-size: 0.75rem; cursor: pointer; padding: 0; margin-top: 15px; display: block;}
    </style>
</head>
<body>

    <header>
        <h1>Functional Path v4</h1>
        <div style="display:flex; gap:6px; align-items:center;">
            <div id="global-timer-box" class="global-timer-display" style="display:none;">00:00</div>
            <div class="bodyweight-box">
                <span style="font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase;">BW:</span>
                <input type="number" id="global-bw" pattern="[0-9]*" inputmode="decimal" placeholder="80" oninput="localStorage.setItem('user_bodyweight', this.value); updateDashboardStats();">
                <span style="font-size: 0.65rem; color: var(--text-muted);">kg</span>
            </div>
        </div>
    </header>

    <!-- PRE-WORKOUT GATE PANEL -->
    <div id="session-gate" class="session-gate-panel">
        <p style="margin: 0 0 12px 0; font-size: 0.85rem; color: var(--text-muted);">Ready to train? Lock your body weight and click start to activate tracking system.</p>
        <button class="start-session-btn" onclick="startWorkoutSession()">▶ Start Training Session</button>
    </div>

    <div class="stats-panel">
        <div class="stat-box">
            <div id="stat-week-ratio" class="stat-num">0.0x</div>
            <div class="stat-label">Weekly Vol/BW Score</div>
        </div>
        <div class="stat-box" style="border-left: 1px solid var(--border-color); border-right: 1px solid var(--border-color);">
            <div id="stat-last-ratio" class="stat-num">0.0x</div>
            <div class="stat-label">Last Session Score</div>
        </div>
        <div class="stat-box">
            <div id="stat-count" class="stat-num">0</div>
            <div class="stat-label">Total Logs</div>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="tab-workout-a" onclick="switchWorkout('workout-a')">A: Push/Pull</button>
        <button class="tab-btn" id="tab-workout-b" onclick="switchWorkout('workout-b')">B: Hinge</button>
        <button class="tab-btn" id="tab-workout-c" onclick="switchWorkout('workout-c')">C: Rotation</button>
        <button class="tab-btn" id="tab-view-history" onclick="switchWorkout('view-history')">📊 Analytics</button>
    </div>

    <div id="workout-a" class="workout-section active"></div>
    <div id="workout-b" class="workout-section"></div>
    <div id="workout-c" class="workout-section"></div>

    <div id="view-history" class="workout-section">
        <div id="weekly-analytics-panel"></div>
        
        <div class="history-section">
            <h3>Logged Training Performance History</h3>
            <div id="history-stream">No sessions found.</div>
            
            <div class="backup-controls">
                <button class="btn-backup" onclick="exportDataData()">📤 Export Backup File</button>
                <label class="btn-backup" style="display: inline-block;">
                    📥 Import Backup File
                    <input type="file" id="import-trigger" accept=".json" onchange="importDataData(event)" style="display: none;">
                </label>
            </div>
            <button class="btn-danger" onclick="resetAllHistory()">⚠️ Wipe App Data</button>
        </div>
    </div>

    <div id="footer-actions" class="finish-container">
        <button class="finish-btn" onclick="finishWorkout()">✓ Complete Workout & Save Metrics</button>
    </div>

    <script>
        const routines = {
            'workout-a': {
                name: 'Workout A',
                exercises: [
                    { id: 'a1', name: '1. Goblet Squat or Box Squat', sets: 3, repsRange: '8-10', unit: 'kg', type: 'reps' },
                    { id: 'a2', name: '2. Lat Pulldown / Assisted Pull-up', sets: 3, repsRange: '10-12', unit: 'kg', type: 'reps' },
                    { id: 'a3', name: '3. Dumbbell Bench Press', sets: 3, repsRange: '8-10', unit: 'kg', type: 'reps' },
                    { id: 'a4', name: '4. Cable Face Pulls', sets: 3, repsRange: '15', unit: 'kg', type: 'reps' },
                    { id: 'a5', name: '5. RKC Plank or Dead Bug', sets: 3, repsRange: 'Hold', unit: 'Sec', type: 'hold' }
                ]
            },
            'workout-b': {
                name: 'Workout B',
                exercises: [
                    { id: 'b1', name: '1. Romanian Deadlift', sets: 3, repsRange: '8-10', unit: 'kg', type: 'reps' },
                    { id: 'b2', name: '2. Seated Cable Row (Wide)', sets: 3, repsRange: '10-12', unit: 'kg', type: 'reps' },
                    { id: 'b3', name: '3. DB Overhead Shoulder Press', sets: 3, repsRange: '8', unit: 'kg', type: 'reps' },
                    { id: 'b4', name: '4. Bulgarian Split Squat', sets: 3, repsRange: '8', unit: 'kg', type: 'reps' },
                    { id: 'b5', name: '5. Farmer’s Walks / Carries', sets: 3, repsRange: '40m', unit: 'kg', type: 'hold' }
                ]
            },
            'workout-c': {
                name: 'Workout C',
                exercises: [
                    { id: 'c1', name: '1. Leg Press or Hack Squat', sets: 3, repsRange: '10', unit: 'kg', type: 'reps' },
                    { id: 'c2', name: '2. Chest-Supported DB Row', sets: 3, repsRange: '10', unit: 'kg', type: 'reps' },
                    { id: 'c3', name: '3. Incline Dumbbell Press', sets: 3, repsRange: '10', unit: 'kg', type: 'reps' },
                    { id: 'c4', name: '4. Cable Woodchoppers', sets: 3, repsRange: '12', unit: 'kg', type: 'reps' },
                    { id: 'c5', name: '5. Hanging Knee Raises', sets: 3, repsRange: '12', unit: 'Reps', type: 'reps' }
                ]
            }
        };

        let activeTabId = 'workout-a';
        let sessionIsRunning = false;
        let globalTimeElapsed = 0;
        let globalTimerInterval = null;
        
        let currentExerciseActiveIndex = {};
        let exerciseClocks = {};
        let holdTimers = {};

        function renderApp() {
            const userBw = localStorage.getItem('user_bodyweight') || '80';
            document.getElementById('global-bw').value = userBw;

            const historyList = JSON.parse(localStorage.getItem('gym_history_stream')) || [];

            for (const [dayId, data] of Object.entries(routines)) {
                const container = document.getElementById(dayId);
                let html = '';

                data.exercises.forEach(ex => {
                    let pastSetRecords = {};
                    const lastMatchingSession = historyList.find(s => s.type === data.name);
                    
                    if (lastMatchingSession) {
                        const regex = new RegExp(`${ex.name.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&')}\\s*\\n(?:\\s*Set\\s*\\d+:\\s*(\\d+(?:\\.\\d+)?)\\s*x\\s*(\\d+)\\s*reps\\s*\\n?)+`, 'g');
                        const match = lastMatchingSession.details.match(regex);
                        if (match) {
                            const setLines = match[0].split('\n').slice(1);
                            setLines.forEach(line => {
                                const parts = line.match(/Set\s*(\d+):\s*(\d+(?:\.\d+)?)\s*x\s*(\d+)/);
                                if(parts) pastSetRecords[parts[1]] = { weight: parts[2], reps: parts[3] };
                            });
                        }
                    }

                    const isExClosed = localStorage.getItem(`closed-${ex.id}`) === 'true';
                    const closedTimeText = localStorage.getItem(`time-spent-${ex.id}`) || '00:00';

                    html += `
                        <div class="exercise-card ${isExClosed ? 'completed-block' : ''}" id="card-${ex.id}">
                            <div class="exercise-header">
                                <h2 class="exercise-title">${ex.name}</h2>
                                <div class="ex-timer-badge" id="clock-${ex.id}">${closedTimeText}</div>
                            </div>
                            
                            <button id="close-btn-${ex.id}" class="close-ex-btn ${isExClosed ? 'frozen' : ''}" 
                                    onclick="closeExerciseTracker('${ex.id}')" ${!sessionIsRunning ? 'disabled' : ''}>
                                ${isExClosed ? '✓ Block Locked' : '🏁 Log & Close Exercise'}
                            </button>

                            <table class="log-table">
                                <thead>
                                    <tr>
                                        <th>Set</th>
                                        <th>Weight (${ex.unit})</th>
                                        <th>${ex.type === 'hold' ? 'Stopwatch' : 'Reps Done'}</th>
                                        <th style="text-align:left; padding-left:4px;">Set Match Target</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;

                    for (let s = 1; s <= ex.sets; s++) {
                        const weightKey = `cur-${ex.id}-w-${s}`;
                        const repKey = `cur-${ex.id}-r-${s}`;

                        const wVal = localStorage.getItem(weightKey) || '';
                        const rVal = localStorage.getItem(repKey) || '';
                        
                        let setTargetDisplay = '<em>No history</em>';
                        if (pastSetRecords[s]) {
                            const pastW = parseFloat(pastSetRecords[s].weight);
                            const pastR = parseInt(pastSetRecords[s].reps);
                            
                            // Safe Scientific Metric Calculators
                            const setE1max = pastW * (1 + pastR / 30);
                            const nextRepsTarget = pastR + 1;

                            setTargetDisplay = `Last: <strong>${pastW}${ex.unit} x ${pastR}</strong> <span style="font-size:0.55rem; color:var(--text-muted)">Est.1RM: ${Math.round(setE1max)}kg</span>
                                                <span>Target: ${pastW}${ex.unit} x ${nextRepsTarget} (+1 Overload)</span>`;
                        }

                        html += `
                            <tr class="log-row">
                                <td class="set-num">${s}</td>
                                <td class="input-cell">
                                    <input type="number" pattern="[0-9]*" inputmode="decimal" id="${weightKey}" class="log-input" placeholder="0" value="${wVal}" oninput="saveCurrentLive('${weightKey}', this.value)" ${!sessionIsRunning || isExClosed ? 'disabled' : ''}>
                                </td>
                                <td class="input-cell">
                                    ${ex.type === 'hold' ? `
                                        <button id="btn-${ex.id}-${s}" class="stopwatch-btn" onclick="toggleHoldStopwatch('${ex.id}', ${s}, '${repKey}')" ${!sessionIsRunning || isExClosed ? 'disabled' : ''}>
                                            ${rVal ? rVal + ' Sec' : '⏱️ Start'}
                                        </button>
                                        <input type="number" id="${repKey}" value="${rVal}" style="display:none;">
                                    ` : `
                                        <input type="number" pattern="[0-9]*" inputmode="numeric" id="${repKey}" class="log-input" placeholder="0" value="${rVal}" oninput="saveCurrentLive('${repKey}', this.value)" ${!sessionIsRunning || isExClosed ? 'disabled' : ''}>
                                    `}
                                </td>
                                <td class="target-cell">${setTargetDisplay}</td>
                            </tr>
                        `;
                    }
                    html += `</tbody></table></div>`;
                });
                container.innerHTML = html;
            }
            updateDashboardStats();
            renderHistoryLog();
        }

        function startWorkoutSession() {
            sessionIsRunning = true;
            globalTimeElapsed = 0;
            
            document.getElementById('session-gate').style.display = 'none';
            document.getElementById('global-timer-box').style.display = 'block';
            document.getElementById('footer-actions').style.display = 'block';

            // Start system clocks
            globalTimerInterval = setInterval(() => {
                globalTimeElapsed++;
                
                // Formulate formatting parameters
                const gMin = Math.floor(globalTimeElapsed / 60).toString().padStart(2, '0');
                const gSec = (globalTimeElapsed % 60).toString().padStart(2, '0');
                document.getElementById('global-timer-box').innerText = `${gMin}:${gSec}`;

                // Tick operational active exercise timers
                const activeRoutine = routines[activeTabId];
                activeRoutine.exercises.forEach(ex => {
                    const isClosed = localStorage.getItem(`closed-${ex.id}`) === 'true';
                    if (!isClosed) {
                        if (!exerciseClocks[ex.id]) exerciseClocks[ex.id] = 0;
                        exerciseClocks[ex.id]++;
                        
                        const eMin = Math.floor(exerciseClocks[ex.id] / 60).toString().padStart(2, '0');
                        const eSec = (exerciseClocks[ex.id] % 60).toString().padStart(2, '0');
                        const clockWidget = document.getElementById(`clock-${ex.id}`);
                        if (clockWidget) clockWidget.innerText = `${eMin}:${eSec}`;
                    }
                });
            }, 1000);

            renderApp();
        }

        function closeExerciseTracker(exId) {
            localStorage.setItem(`closed-${exId}`, 'true');
            const elementClockText = document.getElementById(`clock-${exId}`).innerText;
            localStorage.setItem(`time-spent-${exId}`, elementClockText);
            
            renderApp();
        }

        function toggleHoldStopwatch(exId, setNum, repKey) {
            const btn = document.getElementById(`btn-${exId}-${setNum}`);
            const timerId = `${exId}-${setNum}`;

            if (holdTimers[timerId]) {
                clearInterval(holdTimers[timerId].interval);
                const totalSeconds = Math.round((Date.now() - holdTimers[timerId].start) / 1000);
                localStorage.setItem(repKey, totalSeconds);
                btn.innerText = `${totalSeconds} Sec`;
                btn.classList.remove('running');
                delete holdTimers[timerId];
            } else {
                btn.innerText = "⏱️ Holding...";
                btn.classList.add('running');
                holdTimers[timerId] = {
                    start: Date.now(),
                    interval: setInterval(() => {
                        const elapsed = Math.round((Date.now() - holdTimers[timerId].start) / 1000);
                        btn.innerText = `⏱️ ${elapsed}s`;
                    }, 1000)
                };
            }
        }

        function switchWorkout(dayId) {
            activeTabId = dayId;
            document.querySelectorAll('.workout-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(dayId).classList.add('active');
            document.getElementById(`tab-${dayId}`).classList.add('active');

            const footerBtn = document.getElementById('footer-actions');
            if(sessionIsRunning && dayId !== 'view-history') {
                footerBtn.style.display = 'block';
            } else {
                footerBtn.style.display = 'none';
            }
            window.scrollTo({top: 0});
        }

        function saveCurrentLive(key, val) {
            localStorage.setItem(key, val);
        }

        function finishWorkout() {
            clearInterval(globalTimerInterval);
            const currentRoutine = routines[activeTabId];
            const userBw = parseFloat(localStorage.getItem('user_bodyweight')) || 80;

            let logDetails = '';
            let sessionVolume = 0;
            let loggedCount = 0;

            logDetails += `Total Duration: ${document.getElementById('global-timer-box').innerText}\n\n`;

            currentRoutine.exercises.forEach(ex => {
                let exLines = [];
                const capturedClockText = document.getElementById(`clock-${ex.id}`).innerText;
                
                for (let s = 1; s <= ex.sets; s++) {
                    const weight = localStorage.getItem(`cur-${ex.id}-w-${s}`) || '0';
                    const reps = document.getElementById(`cur-${ex.id}-r-${s}`)?.value || localStorage.getItem(`cur-${ex.id}-r-${s}`) || '0';
                    
                    if (parseInt(reps) > 0) {
                        exLines.push(`  Set ${s}: ${weight} x ${reps} reps`);
                        sessionVolume += (parseFloat(weight) * parseInt(reps));
                        loggedCount++;
                    }
                }
                if (exLines.length > 0) {
                    logDetails += `${ex.name} (${capturedClockText})\n${exLines.join('\n')}\n\n`;
                }
            });

            if (loggedCount === 0) {
                alert("Please complete fields before finalizing track session metrics!");
                return;
            }

            const relativeRatioScore = (sessionVolume / userBw).toFixed(1);
            const today = new Date();
            const dateString = today.toLocaleDateString(undefined, {month: 'short', day: 'numeric', year: 'numeric'});

            const sessionRecord = {
                date: dateString,
                timestamp: Date.now(),
                type: currentRoutine.name,
                volume: sessionVolume,
                ratio: parseFloat(relativeRatioScore),
                details: logDetails.trim()
            };

            let historyList = JSON.parse(localStorage.getItem('gym_history_stream')) || [];
            historyList.unshift(sessionRecord);
            localStorage.setItem('gym_history_stream', JSON.stringify(historyList));

            // Clean engine parameters
            currentRoutine.exercises.forEach(ex => {
                localStorage.removeItem(`closed-${ex.id}`);
                localStorage.removeItem(`time-spent-${ex.id}`);
                exerciseClocks[ex.id] = 0;
                for (let s = 1; s <= ex.sets; s++) {
                    localStorage.removeItem(`cur-${ex.id}-w-${s}`);
                    localStorage.removeItem(`cur-${ex.id}-r-${s}`);
                }
            });

            sessionIsRunning = false;
            document.getElementById('session-gate').style.display = 'block';
            document.getElementById('global-timer-box').style.display = 'none';
            
            alert(`Session Tracked! Relative Score: ${relativeRatioScore}x Bodyweight.`);
            renderApp();
            switchWorkout('view-history');
        }

        function updateDashboardStats() {
            const historyList = JSON.parse(localStorage.getItem('gym_history_stream')) || [];
            const userBw = parseFloat(localStorage.getItem('user_bodyweight')) || 80;
            
            document.getElementById('stat-count').innerText = historyList.length;

            if(historyList.length > 0) {
                document.getElementById('stat-last-ratio').innerText = `${historyList[0].ratio}x`;
            }

            // High-End Professional Sports Science Analytics Module
            // Calculate total volume lifted over the past rolling 7 days
            const sevenDaysAgo = Date.now() - (7 * 24 * 60 * 60 * 1000);
            const recentSessions = historyList.filter(s => s.timestamp >= sevenDaysAgo);
            const weeklyVolumeSum = recentSessions.reduce((acc, curr) => acc + (curr.volume || 0), 0);
            const weeklyRatioScore = (weeklyVolumeSum / userBw).toFixed(1);
            
            document.getElementById('stat-week-ratio').innerText = `${weeklyRatioScore}x`;

            // Render descriptive text inside history panel
            const analyticsBox = document.getElementById('weekly-analytics-panel');
            if(analyticsBox) {
                analyticsBox.innerHTML = `
                    <div class="analytics-block">
                        <div class="analytics-title">📊 Rolling 7-Day Microcycle Metrics</div>
                        Workouts done: <strong>${recentSessions.length}</strong> | Total Week Mass Moved: <strong>${weeklyVolumeSum.toLocaleString()} kg</strong><br>
                        Current Load Profile: <strong>${weeklyRatioScore}x</strong> your body weight cleared this week.
                    </div>
                `;
            }
        }

        function renderHistoryLog() {
            const historyStream = document.getElementById('history-stream');
            const historyList = JSON.parse(localStorage.getItem('gym_history_stream')) || [];

            if (historyList.length === 0) {
                historyStream.innerHTML = "No training sessions recorded yet.";
                return;
            }

            let html = '';
            historyList.forEach(item => {
                html += `
                    <div class="history-item">
                        <span class="history-date">${item.date}</span> - <span style="color: var(--accent-color); font-weight:bold;">${item.type}</span> 
                        <span style="color: var(--warning-color); font-weight:bold; margin-left:10px;">(Score: ${item.ratio}x BW / ${item.volume.toLocaleString()} kg)</span>
                        <div class="history-details">${item.details}</div>
                    </div>
                `;
            });
            historyStream.innerHTML = html;
        }

        function exportDataData() {
            const stateData = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                stateData[key] = localStorage.getItem(key);
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(stateData));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `gym_tracker_v4_backup.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importDataData(event) {
            const fileElement = event.target.files[0];
            if (!fileElement) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const parsed = JSON.parse(e.target.result);
                Object.keys(parsed).forEach(k => { localStorage.setItem(k, parsed[k]); });
                alert("Analytics restored seamlessly!");
                renderApp();
            };
            reader.readAsText(fileElement);
        }

        function resetAllHistory() {
            if (confirm("Reset everything?")) {
                localStorage.clear();
                location.reload();
            }
        }

        renderApp();
    </script>
</body>
</html>
