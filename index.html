<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Functional Path Tracker v3</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151f32;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --border-color: #22314d;
            --success-color: #10b981;
            --warning-color: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            padding-bottom: 60px;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 { margin: 0; font-size: 1.2rem; color: var(--accent-color); }

        .bodyweight-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--card-bg);
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .bodyweight-box input {
            width: 50px;
            background: transparent;
            border: none;
            color: var(--warning-color);
            font-weight: bold;
            font-size: 0.9rem;
            text-align: center;
            outline: none;
        }

        .stats-panel {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-around;
            text-align: center;
        }

        .stat-box { flex: 1; }
        .stat-num { font-size: 1.3rem; font-weight: bold; color: var(--accent-color); }
        .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; margin-top: 2px;}

        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 15px;
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            padding: 6px 0;
            z-index: 10;
        }

        .tab-btn {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px 4px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--accent-color);
            color: var(--bg-color);
            border-color: var(--accent-color);
        }

        .workout-section { display: none; }
        .workout-section.active { display: block; }

        .exercise-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            position: relative;
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .exercise-title { font-size: 0.95rem; font-weight: bold; margin: 0; padding-right: 70px; }
        
        .ex-timer {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 0.7rem;
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-color);
            padding: 3px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-weight: bold;
        }

        .tag {
            font-size: 0.65rem;
            background: rgba(255,255,255,0.05);
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 10px;
        }
        .target-tag { color: var(--warning-color); font-weight: bold; }

        .log-table { width: 100%; border-collapse: collapse; }
        .log-table th { font-size: 0.65rem; color: var(--text-muted); text-align: left; padding-bottom: 6px; text-transform: uppercase;}
        .log-row { border-bottom: 1px solid rgba(255,255,255,0.03); }
        .log-row td { padding: 8px 0; vertical-align: middle; }
        
        .set-num { font-weight: bold; color: var(--text-muted); width: 8%; font-size: 0.8rem;}
        .input-cell { width: 26%; padding-right: 6px; }
        
        .log-input {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 4px;
            border-radius: 6px;
            box-sizing: border-box;
            text-align: center;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .log-input:focus { border-color: var(--accent-color); outline: none; }

        /* HOLD TIMER BUTTON DESIGN */
        .stopwatch-btn {
            width: 100%;
            background: #1e293b;
            border: 1px solid var(--border-color);
            color: var(--warning-color);
            padding: 8px 2px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
        }
        .stopwatch-btn.running {
            background: #ef4444;
            color: white;
        }

        .target-cell { width: 40%; font-size: 0.75rem; color: var(--text-muted); padding-left: 4px; }
        .target-cell strong { color: var(--accent-color); }
        .target-cell span { color: var(--warning-color); display: block; font-size: 0.65rem; margin-top: 1px;}

        .finish-container { margin: 20px 0; }
        .finish-btn {
            width: 100%;
            background: var(--success-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .history-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            margin-top: 15px;
        }
        .history-section h3 { margin-top: 0; color: var(--accent-color); font-size: 1rem; }
        .history-item {
            border-bottom: 1px solid var(--border-color);
            padding: 8px 0;
            font-size: 0.8rem;
        }
        .history-item:last-child { border-bottom: none; }
        .history-date { font-weight: bold; color: var(--text-main); }
        .history-details { color: var(--text-muted); margin-top: 4px; font-family: monospace; white-space: pre-wrap; line-height: 1.3;}

        .backup-controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed var(--border-color);
        }
        .btn-backup {
            flex: 1;
            background: var(--border-color);
            color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .btn-danger { background: none; border: none; color: #ef4444; font-size: 0.75rem; cursor: pointer; padding: 0; margin-top: 15px; display: block;}
    </style>
</head>
<body>

    <header>
        <h1>Functional Path v3</h1>
        <div class="bodyweight-box">
            <span style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase;">BW:</span>
            <input type="number" id="global-bw" pattern="[0-9]*" inputmode="decimal" placeholder="0.0" oninput="localStorage.setItem('user_bodyweight', this.value)">
            <span style="font-size: 0.7rem; color: var(--text-muted);">kg</span>
        </div>
    </header>

    <div class="stats-panel">
        <div class="stat-box">
            <div id="stat-count" class="stat-num">0</div>
            <div class="stat-label">Workouts</div>
        </div>
        <div class="stat-box" style="border-left: 1px solid var(--border-color); border-right: 1px solid var(--border-color);">
            <div id="stat-volume" class="stat-num">0<span style="font-size:0.6rem">kg</span></div>
            <div class="stat-label">All-Time Vol</div>
        </div>
        <div class="stat-box">
            <div id="stat-streak" class="stat-num">-</div>
            <div class="stat-label">Last Session</div>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="tab-workout-a" onclick="switchWorkout('workout-a')">A: Push/Pull</button>
        <button class="tab-btn" id="tab-workout-b" onclick="switchWorkout('workout-b')">B: Hinge</button>
        <button class="tab-btn" id="tab-workout-c" onclick="switchWorkout('workout-c')">C: Rotation</button>
        <button class="tab-btn" id="tab-view-history" onclick="switchWorkout('view-history')">📜 Analytics</button>
    </div>

    <div id="workout-a" class="workout-section active"></div>
    <div id="workout-b" class="workout-section"></div>
    <div id="workout-c" class="workout-section"></div>

    <div id="view-history" class="workout-section">
        <div class="history-section">
            <h3>Logged Training Performance History</h3>
            <div id="history-stream">No training sessions recorded yet.</div>
            
            <div class="backup-controls">
                <button class="btn-backup" onclick="exportDataData()">📤 Export Backup File</button>
                <label class="btn-backup" style="display: inline-block;">
                    📥 Import Backup File
                    <input type="file" id="import-trigger" accept=".json" onchange="importDataData(event)" style="display: none;">
                </label>
            </div>
            <button class="btn-danger" onclick="resetAllHistory()">⚠️ Wipe App Data</button>
        </div>
    </div>

    <div id="footer-actions" class="finish-container">
        <button class="finish-btn" onclick="finishWorkout()">✓ Complete Workout & Save Metrics</button>
    </div>

    <script>
        const routines = {
            'workout-a': {
                name: 'Workout A',
                exercises: [
                    { id: 'a1', name: '1. Goblet Squat or Box Squat', sets: 3, repsRange: '8-10', unit: 'kg', type: 'reps' },
                    { id: 'a2', name: '2. Lat Pulldown / Assisted Pull-up', sets: 3, repsRange: '10-12', unit: 'kg', type: 'reps' },
                    { id: 'a3', name: '3. Dumbbell Bench Press', sets: 3, repsRange: '8-10', unit: 'kg', type: 'reps' },
                    { id: 'a4', name: '4. Cable Face Pulls', sets: 3, repsRange: '15', unit: 'kg', type: 'reps' },
                    { id: 'a5', name: '5. RKC Plank or Dead Bug', sets: 3, repsRange: 'Hold', unit: 'Sec', type: 'hold' }
                ]
            },
            'workout-b': {
                name: 'Workout B',
                exercises: [
                    { id: 'b1', name: '1. Romanian Deadlift', sets: 3, repsRange: '8-10', unit: 'kg', type: 'reps' },
                    { id: 'b2', name: '2. Seated Cable Row (Wide)', sets: 3, repsRange: '10-12', unit: 'kg', type: 'reps' },
                    { id: 'b3', name: '3. DB Overhead Shoulder Press', sets: 3, repsRange: '8', unit: 'kg', type: 'reps' },
                    { id: 'b4', name: '4. Bulgarian Split Squat', sets: 3, repsRange: '8', unit: 'kg', type: 'reps' },
                    { id: 'b5', name: '5. Farmer’s Walks / Carries', sets: 3, repsRange: '40m', unit: 'kg', type: 'hold' }
                ]
            },
            'workout-c': {
                name: 'Workout C',
                exercises: [
                    { id: 'c1', name: '1. Leg Press or Hack Squat', sets: 3, repsRange: '10', unit: 'kg', type: 'reps' },
                    { id: 'c2', name: '2. Chest-Supported DB Row', sets: 3, repsRange: '10', unit: 'kg', type: 'reps' },
                    { id: 'c3', name: '3. Incline Dumbbell Press', sets: 3, repsRange: '10', unit: 'kg', type: 'reps' },
                    { id: 'c4', name: '4. Cable Woodchoppers', sets: 3, repsRange: '12', unit: 'kg', type: 'reps' },
                    { id: 'c5', name: '5. Hanging Knee Raises', sets: 3, repsRange: '12', unit: 'Reps', type: 'reps' }
                ]
            }
        };

        let activeTabId = 'workout-a';
        let holdTimers = {};
        let exerciseTimeTrackers = {};
        let operationalInterval = null;

        function renderApp() {
            if(localStorage.getItem('user_bodyweight')) {
                document.getElementById('global-bw').value = localStorage.getItem('user_bodyweight');
            }

            const historyList = JSON.parse(localStorage.getItem('gym_history_stream')) || [];

            for (const [dayId, data] of Object.entries(routines)) {
                const container = document.getElementById(dayId);
                let html = '';

                data.exercises.forEach(ex => {
                    // Match previous historical session data specifically set-by-set
                    let pastSetRecords = {};
                    const parsedRoutineName = data.name;

                    // Locate the last time this specific routine type was executed
                    const lastMatchingSession = historyList.find(s => s.type === parsedRoutineName);
                    if (lastMatchingSession) {
                        const regex = new RegExp(`${ex.name.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&')}\\s*\\n(?:\\s*Set\\s*\\d+:\\s*(\\d+(?:\\.\\d+)?)\\s*x\\s*(\\d+)\\s*reps\\s*\\n?)+`, 'g');
                        const match = lastMatchingSession.details.match(regex);
                        if (match) {
                            const setLines = match[0].split('\n').slice(1);
                            setLines.forEach(line => {
                                const parts = line.match(/Set\s*(\d+):\s*(\d+(?:\.\d+)?)\s*x\s*(\d+)/);
                                if(parts) {
                                    pastSetRecords[parts[1]] = { weight: parts[2], reps: parts[3] };
                                }
                            });
                        }
                    }

                    // Setup time engine counters for this block
                    if(!exerciseTimeTrackers[ex.id]) {
                        exerciseTimeTrackers[ex.id] = 0;
                    }

                    html += `
                        <div class="exercise-card" id="card-${ex.id}">
                            <div class="exercise-header">
                                <h2 class="exercise-title">${ex.name}</h2>
                                <div class="ex-timer" id="timer-${ex.id}">00:00</div>
                            </div>
                            <span class="tag target-tag">🎯 Routine Range: ${ex.repsRange}</span>

                            <table class="log-table">
                                <thead>
                                    <tr>
                                        <th>Set</th>
                                        <th>Weight (${ex.unit})</th>
                                        <th>${ex.type === 'hold' ? 'Stopwatch' : 'Reps Done'}</th>
                                        <th style="text-align:left; padding-left:10px;">Set Match Target</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;

                    for (let s = 1; s <= ex.sets; s++) {
                        const weightKey = `cur-${ex.id}-w-${s}`;
                        const repKey = `cur-${ex.id}-r-${s}`;

                        const wVal = localStorage.getItem(weightKey) || '';
                        const rVal = localStorage.getItem(repKey) || '';
                        
                        // Set Match Display Logic
                        let setTargetDisplay = '<em>No history</em>';
                        if (pastSetRecords[s]) {
                            const pastW = pastSetRecords[s].weight;
                            const pastR = pastSetRecords[s].reps;
                            const nextR = parseInt(pastR) + 1;
                            setTargetDisplay = `Last: <strong>${pastW}${ex.unit} x ${pastR}</strong>
                                                <span>Target: ${pastW}${ex.unit} x ${nextR} (+1 Overload)</span>`;
                        }

                        html += `
                            <tr class="log-row">
                                <td class="set-num">${s}</td>
                                <td class="input-cell">
                                    <input type="number" pattern="[0-9]*" inputmode="decimal" id="${weightKey}" class="log-input" placeholder="0" value="${wVal}" oninput="saveCurrentLive('${weightKey}', this.value)">
                                </td>
                                <td class="input-cell">
                                    ${ex.type === 'hold' ? `
                                        <button id="btn-${ex.id}-${s}" class="stopwatch-btn" onclick="toggleHoldStopwatch('${ex.id}', ${s}, '${repKey}')">
                                            ${rVal ? rVal + ' Sec' : '⏱️ Start'}
                                        </button>
                                        <input type="number" id="${repKey}" value="${rVal}" style="display:none;">
                                    ` : `
                                        <input type="number" pattern="[0-9]*" inputmode="numeric" id="${repKey}" class="log-input" placeholder="0" value="${rVal}" oninput="saveCurrentLive('${repKey}', this.value)">
                                    `}
                                </td>
                                <td class="target-cell">${setTargetDisplay}</td>
                            </tr>
                        `;
                    }
                    html += `</tbody></table></div>`;
                });
                container.innerHTML = html;
            }
            updateDashboardStats();
            renderHistoryLog();
            initiateExerciseClockEngine();
        }

        // GENERIC TIME SPENT ENGINE
        function initiateExerciseClockEngine() {
            if (operationalInterval) clearInterval(operationalInterval);
            operationalInterval = setInterval(() => {
                if (activeTabId === 'view-history') return;
                
                const currentRoutine = routines[activeTabId];
                if (!currentRoutine) return;

                currentRoutine.exercises.forEach(ex => {
                    exerciseTimeTrackers[ex.id]++;
                    const minutes = Math.floor(exerciseTimeTrackers[ex.id] / 60).toString().padStart(2, '0');
                    const seconds = (exerciseTimeTrackers[ex.id] % 60).toString().padStart(2, '0');
                    const clockLabel = document.getElementById(`timer-${ex.id}`);
                    if (clockLabel) {
                        clockLabel.innerText = `${minutes}:${seconds}`;
                    }
                });
            }, 1000);
        }

        // SMART STOPWATCH FOR PLANK STYLE EXERCISES ONLY
        function toggleHoldStopwatch(exId, setNum, repKey) {
            const btn = document.getElementById(`btn-${exId}-${setNum}`);
            const timerId = `${exId}-${setNum}`;

            if (holdTimers[timerId]) {
                clearInterval(holdTimers[timerId].interval);
                const totalSeconds = Math.round((Date.now() - holdTimers[timerId].start) / 1000);
                
                localStorage.setItem(repKey, totalSeconds);
                btn.innerText = `${totalSeconds} Sec`;
                btn.classList.remove('running');
                delete holdTimers[timerId];
            } else {
                btn.innerText = "⏱️ Holding...";
                btn.classList.add('running');
                holdTimers[timerId] = {
                    start: Date.now(),
                    interval: setInterval(() => {
                        const elapsed = Math.round((Date.now() - holdTimers[timerId].start) / 1000);
                        btn.innerText = `⏱️ ${elapsed}s`;
                    }, 1000)
                };
            }
        }

        function switchWorkout(dayId) {
            activeTabId = dayId;
            document.querySelectorAll('.workout-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(dayId).classList.add('active');
            document.getElementById(`tab-${dayId}`).classList.add('active');

            const footerBtn = document.getElementById('footer-actions');
            footerBtn.style.display = (dayId === 'view-history') ? 'none' : 'block';
            window.scrollTo({top: 0});
        }

        function saveCurrentLive(key, val) {
            localStorage.setItem(key, val);
        }

        function finishWorkout() {
            const currentRoutine = routines[activeTabId];
            if (!currentRoutine) return;

            let logDetails = '';
            let sessionVolume = 0;
            let loggedCount = 0;

            currentRoutine.exercises.forEach(ex => {
                let exLines = [];
                for (let s = 1; s <= ex.sets; s++) {
                    const weight = localStorage.getItem(`cur-${ex.id}-w-${s}`) || '0';
                    const reps = document.getElementById(`cur-${ex.id}-r-${s}`)?.value || localStorage.getItem(`cur-${ex.id}-r-${s}`) || '0';
                    
                    if (parseInt(reps) > 0) {
                        exLines.push(`  Set ${s}: ${weight || 0} x ${reps} reps`);
                        sessionVolume += (parseFloat(weight || 0) * parseInt(reps));
                        loggedCount++;
                    }
                }
                if (exLines.length > 0) {
                    logDetails += `${ex.name}\n${exLines.join('\n')}\n`;
                }
            });

            if (loggedCount === 0) {
                alert("Please track at least one set before processing metrics!");
                return;
            }

            const today = new Date();
            const dateString = today.toLocaleDateString(undefined, {month: 'short', day: 'numeric', year: 'numeric'});

            const sessionRecord = {
                date: dateString,
                type: currentRoutine.name,
                volume: sessionVolume,
                details: logDetails.trim()
            };

            let historyList = JSON.parse(localStorage.getItem('gym_history_stream')) || [];
            historyList.unshift(sessionRecord);
            localStorage.setItem('gym_history_stream', JSON.stringify(historyList));

            localStorage.setItem('stat_total_count', historyList.length);
            localStorage.setItem('stat_total_volume', historyList.reduce((acc, curr) => acc + (curr.volume || 0), 0));
            localStorage.setItem('stat_last_type', currentRoutine.name);

            // Clean working cache parameters
            currentRoutine.exercises.forEach(ex => {
                exerciseTimeTrackers[ex.id] = 0; // reset individual clock timers
                for (let s = 1; s <= ex.sets; s++) {
                    localStorage.removeItem(`cur-${ex.id}-w-${s}`);
                    localStorage.removeItem(`cur-${ex.id}-r-${s}`);
                }
            });

            alert(`Workout Tracked Successfully!`);
            renderApp();
            switchWorkout('view-history');
        }

        function updateDashboardStats() {
            document.getElementById('stat-count').innerText = localStorage.getItem('stat_total_count') || '0';
            const totalVol = parseInt(localStorage.getItem('stat_total_volume')) || 0;
            document.getElementById('stat-volume').innerHTML = `${totalVol.toLocaleString()}<span style="font-size:0.6rem">kg</span>`;
            document.getElementById('stat-streak').innerText = localStorage.getItem('stat_last_type') || '-';
        }

        function renderHistoryLog() {
            const historyStream = document.getElementById('history-stream');
            const historyList = JSON.parse(localStorage.getItem('gym_history_stream')) || [];

            if (historyList.length === 0) {
                historyStream.innerHTML = "No training sessions recorded yet.";
                return;
            }

            let html = '';
            historyList.forEach(item => {
                html += `
                    <div class="history-item">
                        <span class="history-date">${item.date}</span> - <span style="color: var(--accent-color); font-weight:bold;">${item.type}</span> 
                        <span style="color: var(--warning-color); font-weight:bold; margin-left:10px;">(Vol: ${item.volume ? item.volume.toLocaleString() : 0} kg)</span>
                        <div class="history-details">${item.details}</div>
                    </div>
                `;
            });
            historyStream.innerHTML = html;
        }

        function exportDataData() {
            const stateData = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                stateData[key] = localStorage.getItem(key);
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(stateData));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `gym_tracker_v3_backup.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importDataData(event) {
            const fileElement = event.target.files[0];
            if (!fileElement) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const parsed = JSON.parse(e.target.result);
                Object.keys(parsed).forEach(k => { localStorage.setItem(k, parsed[k]); });
                alert("Analytics restored seamlessly!");
                renderApp();
            };
            reader.readAsText(fileElement);
        }

        function resetAllHistory() {
            if (confirm("Reset everything?")) {
                localStorage.clear();
                renderApp();
            }
        }

        renderApp();
    </script>
</body>
</html>
