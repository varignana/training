<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Functional Path Tracker v2</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151f32;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --border-color: #22314d;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --score-up: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            padding-bottom: 60px;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 { margin: 0; font-size: 1.2rem; color: var(--accent-color); }

        .bodyweight-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--card-bg);
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .bodyweight-box input {
            width: 50px;
            background: transparent;
            border: none;
            color: var(--warning-color);
            font-weight: bold;
            font-size: 0.9rem;
            text-align: center;
            outline: none;
        }

        /* Stats Dashboard Panel */
        .stats-panel {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-around;
            text-align: center;
        }

        .stat-box { flex: 1; }
        .stat-num { font-size: 1.3rem; font-weight: bold; color: var(--accent-color); }
        .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; margin-top: 2px;}

        /* Navigation Menu tabs */
        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 15px;
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            padding: 6px 0;
            z-index: 10;
        }

        .tab-btn {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px 4px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--accent-color);
            color: var(--bg-color);
            border-color: var(--accent-color);
        }

        .workout-section { display: none; }
        .workout-section.active { display: block; }

        /* Exercise Design Card */
        .exercise-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .exercise-title { font-size: 0.95rem; font-weight: bold; margin: 0; }
        
        .meta-row {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }

        .tag {
            font-size: 0.65rem;
            background: rgba(255,255,255,0.05);
            padding: 2px 6px;
            border-radius: 4px;
        }
        .target-tag { color: var(--warning-color); font-weight: bold; }

        /* Gamified HUD Box */
        .hud-box {
            background: rgba(0,0,0,0.25);
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 10px;
            font-size: 0.75rem;
            display: flex;
            justify-content: space-between;
            border-left: 3px solid var(--accent-color);
        }
        .hud-block span { display: block; color: var(--text-muted); font-size: 0.65rem; text-transform: uppercase;}
        .hud-block strong { color: var(--text-main); font-size: 0.85rem;}

        /* Input Grid Elements */
        .log-table { width: 100%; border-collapse: collapse; }
        .log-table th { font-size: 0.65rem; color: var(--text-muted); text-align: left; padding-bottom: 4px; text-transform: uppercase;}
        .log-row { border-bottom: 1px solid rgba(255,255,255,0.03); }
        .log-row td { padding: 6px 0; vertical-align: middle; }
        
        .set-num { font-weight: bold; color: var(--text-muted); width: 8%; font-size: 0.8rem;}
        .input-cell { width: 28%; padding-right: 6px; }
        
        .log-input {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 4px;
            border-radius: 6px;
            box-sizing: border-box;
            text-align: center;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .log-input:focus { border-color: var(--accent-color); outline: none; }

        /* Intelligent Tracker Button Counters */
        .tracker-btn {
            width: 100%;
            background: #1e293b;
            border: 1px solid var(--border-color);
            color: var(--accent-color);
            padding: 8px 2px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tracker-btn.running {
            background: #ef4444;
            color: white;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 1; }
            to { opacity: 0.7; }
        }

        .score-cell { width: 20%; text-align: right; font-size: 0.75rem; font-weight: bold; color: var(--text-muted); }
        .score-up { color: var(--success-color); }

        /* Finish Session Footer Action */
        .finish-container { margin: 20px 0; }
        .finish-btn {
            width: 100%;
            background: var(--success-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        /* History Stream Logs */
        .history-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            margin-top: 15px;
        }
        .history-section h3 { margin-top: 0; color: var(--accent-color); font-size: 1rem; }
        .history-item {
            border-bottom: 1px solid var(--border-color);
            padding: 8px 0;
            font-size: 0.8rem;
        }
        .history-item:last-child { border-bottom: none; }
        .history-date { font-weight: bold; color: var(--text-main); }
        .history-details { color: var(--text-muted); margin-top: 4px; font-family: monospace; white-space: pre-wrap; line-height: 1.3;}

        .backup-controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed var(--border-color);
        }
        .btn-backup {
            flex: 1;
            background: var(--border-color);
            color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .btn-danger { background: none; border: none; color: #ef4444; font-size: 0.75rem; cursor: pointer; padding: 0; margin-top: 15px; display: block;}
    </style>
</head>
<body>

    <header>
        <h1>Functional Path v2</h1>
        <div class="bodyweight-box">
            <span style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase;">Bodyweight:</span>
            <input type="number" id="global-bw" pattern="[0-9]*" inputmode="decimal" placeholder="0.0" oninput="localStorage.setItem('user_bodyweight', this.value)">
            <span style="font-size: 0.7rem; color: var(--text-muted);">kg</span>
        </div>
    </header>

    <div class="stats-panel">
        <div class="stat-box">
            <div id="stat-count" class="stat-num">0</div>
            <div class="stat-label">Workouts</div>
        </div>
        <div class="stat-box" style="border-left: 1px solid var(--border-color); border-right: 1px solid var(--border-color);">
            <div id="stat-volume" class="stat-num">0<span style="font-size:0.6rem">kg</span></div>
            <div class="stat-label">All-Time Vol</div>
        </div>
        <div class="stat-box">
            <div id="stat-streak" class="stat-num">-</div>
            <div class="stat-label">Last Workout</div>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchWorkout('workout-a')">A: Push/Pull</button>
        <button class="tab-btn" onclick="switchWorkout('workout-b')">B: Hinge/Mobility</button>
        <button class="tab-btn" onclick="switchWorkout('workout-c')">C: Rotation</button>
        <button class="tab-btn" onclick="switchWorkout('view-history')">📜 Analytics</button>
    </div>

    <div id="workout-a" class="workout-section active"></div>
    <div id="workout-b" class="workout-section"></div>
    <div id="workout-c" class="workout-section"></div>

    <div id="view-history" class="workout-section">
        <div class="history-section">
            <h3>Logged Training Performance History</h3>
            <div id="history-stream">No training sessions recorded yet. Complete a session to map metrics!</div>
            
            <div class="backup-controls">
                <button class="btn-backup" onclick="exportDataData()">📤 Export Backup File</button>
                <label class="btn-backup" style="display: inline-block;">
                    📥 Import Backup File
                    <input type="file" id="import-trigger" accept=".json" onchange="importDataData(event)" style="display: none;">
                </label>
            </div>
            <button class="btn-danger" onclick="resetAllHistory()">⚠️ Wipe App Data</button>
        </div>
    </div>

    <div id="footer-actions" class="finish-container">
        <button class="finish-btn" onclick="finishWorkout()">✓ Complete Workout & Calculate Load</button>
    </div>

    <script>
        const routines = {
            'workout-a': {
                name: 'Workout A',
                exercises: [
                    { id: 'a1', name: '1. Goblet Squat or Box Squat', sets: 3, repsRange: '8-10', unit: 'kg' },
                    { id: 'a2', name: '2. Lat Pulldown / Assisted Pull-up', sets: 3, repsRange: '10-12', unit: 'kg' },
                    { id: 'a3', name: '3. Dumbbell Bench Press', sets: 3, repsRange: '8-10', unit: 'kg' },
                    { id: 'a4', name: '4. Cable Face Pulls', sets: 3, repsRange: '15', unit: 'kg' },
                    { id: 'a5', name: '5. RKC Plank or Dead Bug', sets: 3, repsRange: 'Hold', unit: 'Sec' }
                ]
            },
            'workout-b': {
                name: 'Workout B',
                exercises: [
                    { id: 'b1', name: '1. Romanian Deadlift', sets: 3, repsRange: '8-10', unit: 'kg' },
                    { id: 'b2', name: '2. Seated Cable Row (Wide)', sets: 3, repsRange: '10-12', unit: 'kg' },
                    { id: 'b3', name: '3. DB Overhead Shoulder Press', sets: 3, repsRange: '8', unit: 'kg' },
                    { id: 'b4', name: '4. Bulgarian Split Squat', sets: 3, repsRange: '8', unit: 'kg' },
                    { id: 'b5', name: '5. Farmer’s Walks / Carries', sets: 3, repsRange: '40m', unit: 'kg' }
                ]
            },
            'workout-c': {
                name: 'Workout C',
                exercises: [
                    { id: 'c1', name: '1. Leg Press or Hack Squat', sets: 3, repsRange: '10', unit: 'kg' },
                    { id: 'c2', name: '2. Chest-Supported DB Row', sets: 3, repsRange: '10', unit: 'kg' },
                    { id: 'c3', name: '3. Incline Dumbbell Press', sets: 3, repsRange: '10', unit: 'kg' },
                    { id: 'c4', name: '4. Cable Woodchoppers', sets: 3, repsRange: '12', unit: 'kg' },
                    { id: 'c5', name: '5. Hanging Knee Raises', sets: 3, repsRange: '12', unit: 'Reps' }
                ]
            }
        };

        let activeTabId = 'workout-a';
        let activeTimers = {};

        function renderApp() {
            // Restore bodyweight value
            if(localStorage.getItem('user_bodyweight')) {
                document.getElementById('global-bw').value = localStorage.getItem('user_bodyweight');
            }

            for (const [dayId, data] of Object.entries(routines)) {
                const container = document.getElementById(dayId);
                let html = '';

                data.exercises.forEach(ex => {
                    // Extract historical bests & averages for the HUD
                    const historyList = JSON.parse(localStorage.getItem('gym_history_stream')) || [];
                    let pastWeights = [];
                    let pastReps = [];
                    let bestVol = 0;

                    historyList.forEach(session => {
                        const regex = new RegExp(`${ex.name.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&')}\\s*\\n(?:\\s*Set\\s*\\d+:\\s*(\\d+(?:\\.\\d+)?)\\s*x\\s*(\\d+)\\s*reps\\s*\\n?)+`, 'g');
                        let match;
                        while ((match = regex.exec(session.details)) !== null) {
                            // Secondary internal parsing loop
                            const setLines = match[0].split('\n').slice(1);
                            let exerciseVol = 0;
                            setLines.forEach(line => {
                                const parts = line.match(/Set\s*\d+:\s*(\d+(?:\.\d+)?)\s*x\s*(\d+)/);
                                if(parts) {
                                    const w = parseFloat(parts[1]);
                                    const r = parseInt(parts[2]);
                                    pastWeights.push(w);
                                    pastReps.push(r);
                                    exerciseVol += (w * r);
                                }
                            });
                            if (exerciseVol > bestVol) bestVol = exerciseVol;
                        }
                    });

                    const avgWeight = pastWeights.length ? (pastWeights.reduce((a,b)=>a+b,0)/pastWeights.length).toFixed(1) : '0';
                    const avgReps = pastReps.length ? Math.round(pastReps.reduce((a,b)=>a+b,0)/pastReps.length) : '0';
                    const targetWeight = pastWeights.length ? Math.max(...pastWeights) : '0';
                    const targetReps = pastReps.length ? Math.max(...pastReps) + 1 : parseInt(ex.repsRange) || 10;

                    html += `
                        <div class="exercise-card">
                            <div class="exercise-header">
                                <h2 class="exercise-title">${ex.name}</h2>
                                <span class="tag target-tag">🎯 Goal: ${ex.repsRange}</span>
                            </div>
                            
                            <div class="hud-box">
                                <div class="hud-block"><span>Past Avg</span><strong>${avgWeight}${ex.unit} x ${avgReps}</strong></div>
                                <div class="hud-block"><span>Personal Best Vol</span><strong>${bestVol.toLocaleString()} kg</strong></div>
                                <div class="hud-block"><span style="color:var(--warning-color)">Aim to Beat</span><strong style="color:var(--warning-color)">${targetWeight}${ex.unit} x ${targetReps}</strong></div>
                            </div>

                            <table class="log-table">
                                <thead>
                                    <tr>
                                        <th>Set</th>
                                        <th>Weight (${ex.unit})</th>
                                        <th>Smart Counter</th>
                                        <th style="text-align:right">Score Load</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;

                    for (let s = 1; s <= ex.sets; s++) {
                        const weightKey = `cur-${ex.id}-w-${s}`;
                        const repKey = `cur-${ex.id}-r-${s}`;

                        const wVal = localStorage.getItem(weightKey) || '';
                        const rVal = localStorage.getItem(repKey) || '';
                        
                        // Dynamic live display calculation logic
                        let currentSetScore = '-';
                        let scoreClass = '';
                        if (wVal && rVal) {
                            const curVol = parseFloat(wVal) * parseInt(rVal);
                            currentSetScore = `${curVol} kg`;
                            if(pastWeights.length && curVol > (avgWeight * avgReps)) {
                                scoreClass = 'score-up';
                                currentSetScore = `🔥 ${curVol} kg`;
                            }
                        }

                        html += `
                            <tr class="log-row">
                                <td class="set-num">${s}</td>
                                <td class="input-cell">
                                    <input type="number" pattern="[0-9]*" inputmode="decimal" id="${weightKey}" class="log-input" placeholder="0" value="${wVal}" oninput="saveCurrentLive('${weightKey}', this.value); evaluateLiveGrid();">
                                </td>
                                <td class="input-cell">
                                    <button id="btn-${ex.id}-${s}" class="tracker-btn" onclick="toggleSmartRepCounter('${ex.id}', ${s}, '${repKey}')">
                                        ${rVal ? 'Reps: ' + rVal : '⏱️ Start Set'}
                                    </button>
                                    <input type="number" id="${repKey}" value="${rVal}" style="display:none;">
                                </td>
                                <td id="score-${ex.id}-${s}" class="score-cell ${scoreClass}">${currentSetScore}</td>
                            </tr>
                        `;
                    }
                    html += `</tbody></table></div>`;
                });
                container.innerHTML = html;
            }
            updateDashboardStats();
            renderHistoryLog();
        }

        // SMART TIMER BUTTON CONTROLLER
        function toggleSmartRepCounter(exId, setNum, repKey) {
            const btn = document.getElementById(`btn-${exId}-${setNum}`);
            const timerId = `${exId}-${setNum}`;

            if (activeTimers[timerId]) {
                // STOP TIMER & CALCULATE APPROXIMATED REPS BASED ON TIME SPENT UNDER TENSION
                clearInterval(activeTimers[timerId].interval);
                const secondsElapsed = Math.round((Date.now() - activeTimers[timerId].start) / 1000);
                
                // Average functional rep under tension takes roughly 3 seconds (1.5s up, 1.5s down)
                let calculatedReps = Math.max(1, Math.round(secondsElapsed / 3));
                
                // Prompt user instantly so they can confirm or adjust manually
                let finalReps = prompt(`Set completed! Detected Time: ${secondsElapsed}s.\nEstimated Reps achieved:`, calculatedReps);
                if (finalReps === null) finalReps = calculatedReps; // Fallback to calculation if cancel clicked
                
                localStorage.setItem(repKey, finalReps);
                btn.innerText = `Reps: ${finalReps}`;
                btn.classList.remove('running');
                delete activeTimers[timerId];
                
                evaluateLiveGrid();
            } else {
                // START TIMER
                btn.innerText = "⏱️ Counting...";
                btn.classList.add('running');
                activeTimers[timerId] = {
                    start: Date.now(),
                    interval: setInterval(() => {
                        const elapsed = Math.round((Date.now() - activeTimers[timerId].start) / 1000);
                        btn.innerText = `⏱️ Reps ~${Math.max(1, Math.round(elapsed / 3))} (${elapsed}s)`;
                    }, 1000)
                };
            }
        }

        function evaluateLiveGrid() {
            // Real-time structural grid calculation update loop without rendering the entire app view
            for (const [dayId, data] of Object.entries(routines)) {
                data.exercises.forEach(ex => {
                    for (let s = 1; s <= ex.sets; s++) {
                        const w = document.getElementById(`cur-${ex.id}-w-${s}`)?.value;
                        const r = localStorage.getItem(`cur-${ex.id}-r-${s}`);
                        const cell = document.getElementById(`score-${ex.id}-${s}`);
                        
                        if (w && r && cell) {
                            const v = parseFloat(w) * parseInt(r);
                            cell.innerText = `🔥 ${v} kg`;
                            cell.classList.add('score-up');
                        }
                    }
                });
            }
        }

        function switchWorkout(dayId) {
            activeTabId = dayId;
            document.querySelectorAll('.workout-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(dayId).classList.add('active');
            event.currentTarget.classList.add('active');

            const footerBtn = document.getElementById('footer-actions');
            footerBtn.style.display = (dayId === 'view-history') ? 'none' : 'block';
            window.scrollTo({top: 0});
        }

        function saveCurrentLive(key, val) {
            localStorage.setItem(key, val);
        }

        function finishWorkout() {
            const currentRoutine = routines[activeTabId];
            if (!currentRoutine) return;

            let logDetails = '';
            let sessionVolume = 0;
            let loggedCount = 0;

            currentRoutine.exercises.forEach(ex => {
                let exLines = [];
                for (let s = 1; s <= ex.sets; s++) {
                    const weight = localStorage.getItem(`cur-${ex.id}-w-${s}`) || '0';
                    const reps = localStorage.getItem(`cur-${ex.id}-r-${s}`) || '0';
                    
                    if (parseFloat(weight) > 0 && parseInt(reps) > 0) {
                        exLines.push(`  Set ${s}: ${weight} x ${reps} reps`);
                        sessionVolume += (parseFloat(weight) * parseInt(reps));
                        loggedCount++;
                    }
                }
                if (exLines.length > 0) {
                    logDetails += `${ex.name}\n${exLines.join('\n')}\n`;
                }
            });

            if (loggedCount === 0) {
                alert("Please complete at least one set via the Smart Counter before finalizing data output!");
                return;
            }

            const today = new Date();
            const dateString = today.toLocaleDateString(undefined, {month: 'short', day: 'numeric', year: 'numeric'});

            const sessionRecord = {
                date: dateString,
                type: currentRoutine.name,
                volume: sessionVolume,
                details: logDetails.trim()
            };

            let historyList = JSON.parse(localStorage.getItem('gym_history_stream')) || [];
            historyList.unshift(sessionRecord);
            localStorage.setItem('gym_history_stream', JSON.stringify(historyList));

            // Accumulate global statistics variables
            let totalAllTimeVolume = historyList.reduce((acc, curr) => acc + (curr.volume || 0), 0);
            localStorage.setItem('stat_total_count', historyList.length);
            localStorage.setItem('stat_total_volume', totalAllTimeVolume);
            localStorage.setItem('stat_last_type', currentRoutine.name);

            // Wipe setup fields cleanly
            currentRoutine.exercises.forEach(ex => {
                for (let s = 1; s <= ex.sets; s++) {
                    localStorage.removeItem(`cur-${ex.id}-w-${s}`);
                    localStorage.removeItem(`cur-${ex.id}-r-${s}`);
                }
            });

            alert(`Workout Tracked Successfully!\nTotal Session Load: ${sessionVolume.toLocaleString()} kg raised.`);
            renderApp();
            switchWorkout('view-history');
        }

        function updateDashboardStats() {
            document.getElementById('stat-count').innerText = localStorage.getItem('stat_total_count') || '0';
            const totalVol = parseInt(localStorage.getItem('stat_total_volume')) || 0;
            document.getElementById('stat-volume').innerHTML = `${totalVol.toLocaleString()}<span style="font-size:0.6rem">kg</span>`;
            document.getElementById('stat-streak').innerText = localStorage.getItem('stat_last_type') || '-';
        }

        function renderHistoryLog() {
            const historyStream = document.getElementById('history-stream');
            const historyList = JSON.parse(localStorage.getItem('gym_history_stream')) || [];

            if (historyList.length === 0) {
                historyStream.innerHTML = "No training sessions recorded yet. Complete a session to map metrics!";
                return;
            }

            let html = '';
            historyList.forEach(item => {
                html += `
                    <div class="history-item">
                        <span class="history-date">${item.date}</span> - <span style="color: var(--accent-color); font-weight:bold;">${item.type}</span> 
                        <span style="color: var(--warning-color); font-weight:bold; margin-left:10px;">(Vol: ${item.volume ? item.volume.toLocaleString() : 0} kg)</span>
                        <div class="history-details">${item.details}</div>
                    </div>
                `;
            });
            historyStream.innerHTML = html;
        }

        function exportDataData() {
            const stateData = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                stateData[key] = localStorage.getItem(key);
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(stateData));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `gym_tracker_v2_backup.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importDataData(event) {
            const fileElement = event.target.files[0];
            if (!fileElement) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const parsed = JSON.parse(e.target.result);
                Object.keys(parsed).forEach(k => { localStorage.setItem(k, parsed[k]); });
                alert("Analytics restored seamlessly!");
                renderApp();
            };
            reader.readAsText(fileElement);
        }

        function resetAllHistory() {
            if (confirm("Reset everything?")) {
                localStorage.clear();
                renderApp();
            }
        }

        renderApp();
    </script>
</body>
</html>
