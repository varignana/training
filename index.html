<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Functional Path Analytics v6</title>
    <style>
        :root {
            --bg-color: #060913;
            --card-bg: #10192e;
            --accent-color: #38bdf8;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #243557;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --row-complete-border: #10b981;
            --row-complete-bg: rgba(16, 185, 129, 0.07);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            padding-bottom: 60px;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 { margin: 0; font-size: 1.2rem; color: var(--accent-color); }

        .bodyweight-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--card-bg);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        .bodyweight-box span { color: var(--text-main); font-weight: bold; }
        .bodyweight-box input {
            width: 55px;
            background: transparent;
            border: none;
            color: var(--warning-color);
            font-weight: bold;
            font-size: 1rem;
            text-align: center;
            outline: none;
        }

        .session-gate-panel {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px dashed var(--accent-color);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 15px;
        }
        .start-session-btn {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .global-timer-display {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--warning-color);
            background: rgba(245, 158, 11, 0.15);
            padding: 5px 12px;
            border-radius: 6px;
            font-family: monospace;
        }

        .stats-panel {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-around;
            text-align: center;
        }
        .stat-box { flex: 1; }
        .stat-num { font-size: 1.2rem; font-weight: bold; color: var(--accent-color); }
        .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; margin-top: 2px; font-weight: bold;}

        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 15px;
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            padding: 6px 0;
            z-index: 10;
        }
        .tab-btn {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px 4px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .tab-btn.active {
            background: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        .workout-section { display: none; }
        .workout-section.active { display: block; }

        .exercise-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 14px;
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            gap: 8px;
        }
        .exercise-title { font-size: 1rem; font-weight: bold; margin: 0; color: var(--text-main); flex-grow: 1; }
        
        .ex-controls { display: flex; align-items: center; gap: 6px; }
        .ex-clock-badge {
            font-size: 0.8rem;
            background: rgba(255,255,255,0.08);
            color: var(--text-main);
            padding: 4px 8px;
            border-radius: 6px;
            font-family: monospace;
            font-weight: bold;
            border: 1px solid var(--border-color);
        }
        .clock-toggle-btn {
            background: var(--border-color);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--accent-color);
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .clock-toggle-btn.active-run { background: #ef4444; color: white; }

        .metrics-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            background: rgba(0,0,0,0.25);
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }
        .efficiency-badge {
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--success-color);
        }
        .alltime-best-badge {
            font-size: 0.7rem;
            font-weight: bold;
            color: #ec4899; /* Pink accent color for absolute PB records */
            background: rgba(236, 72, 153, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .log-table { width: 100%; border-collapse: collapse; }
        .log-table th { font-size: 0.7rem; color: var(--text-muted); text-align: left; padding-bottom: 6px; text-transform: uppercase;}
        
        /* Tactical Full Row Completion Design */
        .log-row { border-bottom: 1px solid var(--border-color); transition: all 0.2s ease; }
        .log-row.row-filled {
            background-color: var(--row-complete-bg) !important;
        }
        .log-row td { padding: 10px 4px; vertical-align: middle; }
        
        .set-num { font-weight: bold; color: var(--text-main); width: 8%; font-size: 0.85rem;}
        
        /* Border box wrapper logic around inputs */
        .input-container-box {
            display: flex;
            align-items: center;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-color);
            padding: 2px;
            width: 92%;
        }
        .row-filled .input-container-box {
            border: 1.5px solid var(--row-complete-border);
        }

        .log-input {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 6px 2px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: bold;
            outline: none;
        }
        .log-input:disabled { opacity: 0.2; }

        .stopwatch-btn {
            width: 100%;
            background: #1e293b;
            border: none;
            color: var(--warning-color);
            padding: 7px 2px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
        }
        .stopwatch-btn.running { background: #ef4444; color: white; }

        .target-cell { width: 40%; font-size: 0.75rem; color: var(--text-muted); line-height: 1.3; position: relative; padding-left: 6px;}
        .target-cell strong { color: var(--accent-color); }
        .target-cell span { color: var(--warning-color); display: block; font-size: 0.65rem; margin-top: 2px;}

        /* Return of the satisfying status mark check */
        .check-status-badge {
            display: none;
            color: var(--success-color);
            font-weight: bold;
            font-size: 0.75rem;
            background: rgba(16, 185, 129, 0.15);
            padding: 2px 5px;
            border-radius: 4px;
            float: right;
            margin-right: 4px;
        }
        .row-filled .check-status-badge { display: inline-block; }

        .action-tray {
            margin: 20px 0;
            display: none;
            flex-direction: column;
            gap: 10px;
        }
        .live-day-efficiency {
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .finish-btn {
            width: 100%;
            background: var(--success-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .reset-day-btn {
            width: 100%;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
        }

        .analytics-block {
            background: #111827;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 0.8rem;
            line-height: 1.4;
        }
        .analytics-title { color: var(--accent-color); font-weight: bold; font-size: 0.9rem; margin-bottom: 6px; }

        .history-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            margin-top: 15px;
        }
        .history-section h3 { margin-top: 0; color: var(--accent-color); font-size: 1rem; }
        .history-item {
            border-bottom: 1px solid var(--border-color);
            padding: 10px 0;
            font-size: 0.85rem;
        }
        .history-item:last-child { border-bottom: none; }
        .history-date { font-weight: bold; color: var(--text-main); }
        .history-details { color: var(--text-muted); margin-top: 6px; font-family: monospace; white-space: pre-wrap; line-height: 1.3;}

        .backup-controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed var(--border-color);
        }
        .btn-backup {
            flex: 1;
            background: var(--border-color);
            color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .btn-danger { background: none; border: none; color: #ef4444; font-size: 0.75rem; cursor: pointer; padding: 0; margin-top: 15px; display: block;}
    </style>
</head>
<body>

    <header>
        <h1>Functional Path v6</h1>
        <div style="display:flex; gap:6px; align-items:center;">
            <div id="global-timer-box" class="global-timer-display" style="display:none;">00:00</div>
            <div class="bodyweight-box">
                <span style="font-size: 0.75rem; text-transform: uppercase; margin-right:2px;">BW:</span>
                <input type="number" id="global-bw" pattern="[0-9]*" inputmode="decimal" placeholder="80" oninput="localStorage.setItem('user_bodyweight', this.value); evaluateLiveGridAndEfficiency();">
                <span style="font-size: 0.75rem; color: var(--text-muted);">kg</span>
            </div>
        </div>
    </header>

    <div id="session-gate" class="session-gate-panel">
        <p style="margin: 0 0 12px 0; font-size: 0.9rem; color: var(--text-muted);">Lock your morning body weight, then click Start Session to open trackers.</p>
        <button class="start-session-btn" onclick="startWorkoutSession()">▶ Start Training Session</button>
    </div>

    <div class="stats-panel">
        <div class="stat-box">
            <div id="stat-week-ratio" class="stat-num">0.0x</div>
            <div class="stat-label">Weekly Score</div>
        </div>
        <div class="stat-box" style="border-left: 1px solid var(--border-color); border-right: 1px solid var(--border-color);">
            <div id="stat-last-ratio" class="stat-num">0.0x</div>
            <div class="stat-label">Last Session</div>
        </div>
        <div class="stat-box">
            <div id="stat-count" class="stat-num">0</div>
            <div class="stat-label">Total Logs</div>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="tab-workout-a" onclick="switchWorkout('workout-a')">A: Push/Pull</button>
        <button class="tab-btn" id="tab-workout-b" onclick="switchWorkout('workout-b')">B: Hinge</button>
        <button class="tab-btn" id="tab-workout-c" onclick="switchWorkout('workout-c')">C: Rotation</button>
        <button class="tab-btn" id="tab-view-history" onclick="switchWorkout('view-history')">📊 Analytics</button>
    </div>

    <div id="workout-a" class="workout-section active"></div>
    <div id="workout-b" class="workout-section"></div>
    <div id="workout-c" class="workout-section"></div>

    <div id="view-history" class="workout-section">
        <div id="weekly-analytics-panel"></div>
        
        <div class="history-section">
            <h3>Logged Training Performance History</h3>
            <div id="history-stream">No training sessions recorded yet.</div>
            
            <div class="backup-controls">
                <button class="btn-backup" onclick="exportDataData()">📤 Export Backup File</button>
                <label class="btn-backup" style="display: inline-block;">
                    📥 Import Backup File
                    <input type="file" id="import-trigger" accept=".json" onchange="importDataData(event)" style="display: none;">
                </label>
            </div>
            <button class="btn-danger" onclick="resetAllHistory()">⚠️ Wipe App Data</button>
        </div>
    </div>

    <div id="footer-actions" class="action-tray">
        <div class="live-day-efficiency">
            Session Efficiency Load: <span id="live-day-score" style="color:var(--accent-color)">0.0x</span> BW Multiplier
        </div>
        <button class="finish-btn" onclick="finishWorkout()">✓ Complete Workout & Save Metrics</button>
        <button class="reset-day-btn" onclick="resetCurrentSessionInputs()">🔄 Reset Day Data</button>
    </div>

    <script>
        const routines = {
            'workout-a': {
                name: 'Workout A',
                exercises: [
                    { id: 'a1', name: '1. Goblet Squat or Box Squat', sets: 3, repsRange: '8-10', unit: 'kg', type: 'reps' },
                    { id: 'a2', name: '2. Lat Pulldown / Assisted Pull-up', sets: 3, repsRange: '10-12', unit: 'kg', type: 'reps' },
                    { id: 'a3', name: '3. Dumbbell Bench Press', sets: 3, repsRange: '8-10', unit: 'kg', type: 'reps' },
                    { id: 'a4', name: '4. Cable Face Pulls', sets: 3, repsRange: '15', unit: 'kg', type: 'reps' },
                    { id: 'a5', name: '5. RKC Plank or Dead Bug', sets: 3, repsRange: 'Hold', unit: 'Sec', type: 'hold' }
                ]
            },
            'workout-b': {
                name: 'Workout B',
                exercises: [
                    { id: 'b1', name: '1. Romanian Deadlift', sets: 3, repsRange: '8-10', unit: 'kg', type: 'reps' },
                    { id: 'b2', name: '2. Seated Cable Row (Wide)', sets: 3, repsRange: '10-12', unit: 'kg', type: 'reps' },
                    { id: 'b3', name: '3. DB Overhead Shoulder Press', sets: 3, repsRange: '8', unit: 'kg', type: 'reps' },
                    { id: 'b4', name: '4. Bulgarian Split Squat', sets: 3, repsRange: '8', unit: 'kg', type: 'reps' },
                    { id: 'b5', name: '5. Farmer’s Walks / Carries', sets: 3, repsRange: '40m', unit: 'kg', type: 'hold' }
                ]
            },
            'workout-c': {
                name: 'Workout C',
                exercises: [
                    { id: 'c1', name: '1. Leg Press or Hack Squat', sets: 3, repsRange: '10', unit: 'kg', type: 'reps' },
                    { id: 'c2', name: '2. Chest-Supported DB Row', sets: 3, repsRange: '10', unit: 'kg', type: 'reps' },
                    { id: 'c3', name: '3. Incline Dumbbell Press', sets: 3, repsRange: '10', unit: 'kg', type: 'reps' },
                    { id: 'c4', name: '4. Cable Woodchoppers', sets: 3, repsRange: '12', unit: 'kg', type: 'reps' },
                    { id: 'c5', name: '5. Hanging Knee Raises', sets: 3, repsRange: '12', unit: 'Reps', type: 'reps' }
                ]
            }
        };

        let activeTabId = 'workout-a';
        let sessionIsRunning = false;
        let globalTimeElapsed = 0;
        let globalTimerInterval = null;
        
        let exerciseClockStates = {}; 
        let holdTimers = {};

        function renderApp() {
            const userBw = parseFloat(localStorage.getItem('user_bodyweight')) || 80;
            document.getElementById('global-bw').value = userBw;

            const historyList = JSON.parse(localStorage.getItem('gym_history_stream')) || [];

            for (const [dayId, data] of Object.entries(routines)) {
                const container = document.getElementById(dayId);
                let html = '';

                data.exercises.forEach(ex => {
                    let pastSetRecords = {};
                    
                    // Pull All-Time Peak Personal Best Multiplier score for this exercise card
                    let peakPersonalBest = localStorage.getItem(`pb-score-${ex.id}`) || '0.0';

                    const lastMatchingSession = historyList.find(s => s.type === data.name);
                    if (lastMatchingSession) {
                        const regex = new RegExp(`${ex.name.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&')}\\s*\\n(?:\\s*Set\\s*\\d+:\\s*(\\d+(?:\\.\\d+)?)\\s*x\\s*(\\d+)\\s*reps\\s*\\n?)+`, 'g');
                        const match = lastMatchingSession.details.match(regex);
                        if (match) {
                            const setLines = match[0].split('\n').slice(1);
                            setLines.forEach(line => {
                                const parts = line.match(/Set\s*(\d+):\s*(\d+(?:\.\d+)?)\s*x\s*(\d+)/);
                                if(parts) pastSetRecords[parts[1]] = { weight: parts[2], reps: parts[3] };
                            });
                        }
                    }

                    const elapsedSavedClock = localStorage.getItem(`ex-clock-time-${ex.id}`) || '00:00';

                    html += `
                        <div class="exercise-card" id="card-${ex.id}">
                            <div class="exercise-header">
                                <h2 class="exercise-title">${ex.name}</h2>
                                <div class="ex-controls">
                                    <div class="ex-clock-badge" id="clock-${ex.id}">${elapsedSavedClock}</div>
                                    <button id="clock-toggle-${ex.id}" class="clock-toggle-btn" 
                                            onclick="toggleExerciseClock('${ex.id}')" ${!sessionIsRunning ? 'disabled' : ''}>
                                        ▶ Start Clock
                                    </button>
                                </div>
                            </div>
                            
                            <div class="metrics-bar">
                                <span class="alltime-best-badge">🏆 Best Ever: ${peakPersonalBest}x BW</span>
                                <div class="efficiency-badge">Live: <span id="eff-${ex.id}">0.0x</span> BW</div>
                            </div>

                            <table class="log-table">
                                <thead>
                                    <tr>
                                        <th>Set</th>
                                        <th>Weight (${ex.unit})</th>
                                        <th>${ex.type === 'hold' ? 'Stopwatch' : 'Reps Done'}</th>
                                        <th style="text-align:left; padding-left:6px;">Progressive Overload Target</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;

                    for (let s = 1; s <= ex.sets; s++) {
                        const weightKey = `cur-${ex.id}-w-${s}`;
                        const repKey = `cur-${ex.id}-r-${s}`;

                        const wVal = localStorage.getItem(weightKey) || '';
                        const rVal = localStorage.getItem(repKey) || '';

                        let setTargetDisplay = '<span style="color:var(--text-muted)">No baseline</span>';
                        if (pastSetRecords[s]) {
                            const pastW = parseFloat(pastSetRecords[s].weight);
                            const pastR = parseInt(pastSetRecords[s].reps);
                            const nextR = pastR + 1;
                            
                            // Formulate Overload Efficiency target
                            let scoreTarget = "";
                            if (ex.type === 'hold') {
                                scoreTarget = ((pastR + 5) / 10).toFixed(1);
                                setTargetDisplay = `Last: <strong>${pastR}s</strong>
                                                    <span>Target: Hold ${pastR + 5}s (+5s Overload) → Aim for ${scoreTarget}x</span>`;
                            } else {
                                scoreTarget = ((pastW * nextR) / userBw).toFixed(1);
                                setTargetDisplay = `Last: <strong>${pastW}kg x ${pastR}</strong>
                                                    <span>Target: ${pastW}kg x ${nextR} (+1 Rep Overload) → Aim for ${scoreTarget}x</span>`;
                            }
                        }

                        html += `
                            <tr class="log-row" id="row-${ex.id}-${s}">
                                <td class="set-num">${s}</td>
                                <td class="input-cell">
                                    <div class="input-container-box">
                                        <input type="number" pattern="[0-9]*" inputmode="decimal" id="${weightKey}" class="log-input" placeholder="0" value="${wVal}" oninput="saveCurrentLive('${weightKey}', this.value); evaluateLiveGridAndEfficiency();" ${!sessionIsRunning ? 'disabled' : ''}>
                                    </div>
                                </td>
                                <td class="input-cell">
                                    <div class="input-container-box" style="background:transparent; border:none;">
                                    ${ex.type === 'hold' ? `
                                        <button id="btn-${ex.id}-${s}" class="stopwatch-btn" onclick="toggleHoldStopwatch('${ex.id}', ${s}, '${repKey}')" ${!sessionIsRunning ? 'disabled' : ''}>
                                            ${rVal ? rVal + ' Sec' : '⏱️ Start'}
                                        </button>
                                        <input type="number" id="${repKey}" value="${rVal}" style="display:none;">
                                    ` : `
                                        <div class="input-container-box" style="width:100%;">
                                            <input type="number" pattern="[0-9]*" inputmode="numeric" id="${repKey}" class="log-input" placeholder="0" value="${rVal}" oninput="saveCurrentLive('${repKey}', this.value); evaluateLiveGridAndEfficiency();" ${!sessionIsRunning ? 'disabled' : ''}>
                                        </div>
                                    `}
                                    </div>
                                </td>
                                <td class="target-cell">
                                    <span class="check-status-badge">✓ Complete</span>
                                    ${setTargetDisplay}
                                </td>
                            </tr>
                        `;
                    }
                    html += `</tbody></table></div>`;
                });
                container.innerHTML = html;
            }
            updateDashboardStats();
            renderHistoryLog();
            evaluateLiveGridAndEfficiency();
        }

        function startWorkoutSession() {
            sessionIsRunning = true;
            globalTimeElapsed = 0;
            
            document.getElementById('session-gate').style.display = 'none';
            document.getElementById('global-timer-box').style.display = 'block';
            document.getElementById('footer-actions').style.display = 'flex';

            globalTimerInterval = setInterval(() => {
                globalTimeElapsed++;
                const gMin = Math.floor(globalTimeElapsed / 60).toString().padStart(2, '0');
                const gSec = (globalTimeElapsed % 60).toString().padStart(2, '0');
                document.getElementById('global-timer-box').innerText = `${gMin}:${gSec}`;

                Object.keys(exerciseClockStates).forEach(exId => {
                    if (exerciseClockStates[exId].running) {
                        exerciseClockStates[exId].time++;
                        const eMin = Math.floor(exerciseClockStates[exId].time / 60).toString().padStart(2, '0');
                        const eSec = (exerciseClockStates[exId].time % 60).toString().padStart(2, '0');
                        
                        const clockText = `${eMin}:${eSec}`;
                        localStorage.setItem(`ex-clock-time-${exId}`, clockText);
                        
                        const badge = document.getElementById(`clock-${exId}`);
                        if (badge) badge.innerText = clockText;
                    }
                });
            }, 1000);

            renderApp();
        }

        function toggleExerciseClock(exId) {
            const btn = document.getElementById(`clock-toggle-${exId}`);
            if (!exerciseClockStates[exId]) {
                exerciseClockStates[exId] = { time: 0, running: false };
            }

            if (exerciseClockStates[exId].running) {
                exerciseClockStates[exId].running = false;
                btn.innerText = "▶ Start Clock";
                btn.classList.remove('active-run');
            } else {
                exerciseClockStates[exId].running = true;
                btn.innerText = "⏸ Pause Clock";
                btn.classList.add('active-run');
            }
        }

        function toggleHoldStopwatch(exId, setNum, repKey) {
            const btn = document.getElementById('btn-' + exId + '-' + setNum);
            const timerId = exId + '-' + setNum;

            if (holdTimers[timerId]) {
                clearInterval(holdTimers[timerId].interval);
                const totalSeconds = Math.round((Date.now() - holdTimers[timerId].start) / 1000);
                localStorage.setItem(repKey, totalSeconds);
                btn.innerText = totalSeconds + " Sec";
                btn.classList.remove('running');
                delete holdTimers[timerId];
                evaluateLiveGridAndEfficiency();
            } else {
                btn.innerText = "⏱️ Stop";
                btn.classList.add('running');
                holdTimers[timerId] = {
                    start: Date.now(),
                    interval: setInterval(() => {
                        const elapsed = Math.round((Date.now() - holdTimers[timerId].start) / 1000);
                        btn.innerText = "⏱️ " + elapsed + "s";
                    }, 1000)
                };
            }
        }

        // SCIENTIFIC EXERCISE PROFILE EFFICIENCY ENGINE
        function evaluateLiveGridAndEfficiency() {
            const userBw = parseFloat(document.getElementById('global-bw').value) || 80;
            const currentRoutine = routines[activeTabId];
            let dayTotalVolumeScore = 0;

            if (!currentRoutine) return;

            currentRoutine.exercises.forEach(ex => {
                let exerciseVolumeLoad = 0;
                let holdsTotalSeconds = 0;
                
                for (let s = 1; s <= ex.sets; s++) {
                    const rowElement = document.getElementById(`row-${ex.id}-${s}`);
                    const wInput = document.getElementById(`cur-${ex.id}-w-${s}`);
                    
                    const wVal = wInput ? wInput.value : '';
                    const rVal = localStorage.getItem(`cur-${ex.id}-r-${s}`) || '';

                    if (rowElement) {
                        if (rVal !== '' && (ex.type === 'hold' || wVal !== '')) {
                            rowElement.classList.add('row-filled');
                            
                            if (ex.type === 'hold') {
                                holdsTotalSeconds += parseInt(rVal) || 0;
                            } else {
                                exerciseVolumeLoad += (parseFloat(wVal) || 0) * (parseInt(rVal) || 0);
                            }
                        } else {
                            rowElement.classList.remove('row-filled');
                        }
                    }
                }

                // Unified calculation logic (Weighted Volume Load vs. Bodyweight Hold TUT Baseline)
                let calculatedExerciseScore = 0;
                if (ex.type === 'hold') {
                    calculatedExerciseScore = holdsTotalSeconds / 10;
                } else {
                    calculatedExerciseScore = exerciseVolumeLoad / userBw;
                }

                dayTotalVolumeScore += calculatedExerciseScore;
                
                const exEffBadge = document.getElementById(`eff-${ex.id}`);
                if (exEffBadge) {
                    exEffBadge.innerText = calculatedExerciseScore.toFixed(1) + 'x';
                }
            });

            const dayScoreText = document.getElementById('live-day-score');
            if (dayScoreText) {
                dayScoreText.innerText = dayTotalVolumeScore.toFixed(1) + 'x';
            }
        }

        function switchWorkout(dayId) {
            activeTabId = dayId;
            document.querySelectorAll('.workout-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(dayId).classList.add('active');
            document.getElementById(`tab-${dayId}`).classList.add('active');

            const footerBtn = document.getElementById('footer-actions');
            if(sessionIsRunning && dayId !== 'view-history') {
                footerBtn.style.display = 'flex';
                evaluateLiveGridAndEfficiency();
            } else {
                footerBtn.style.display = 'none';
            }
            window.scrollTo({top: 0});
        }

        function saveCurrentLive(key, val) {
            localStorage.setItem(key, val);
        }

        function resetCurrentSessionInputs() {
            if (!confirm("Reset all training inputs for this current workout view?")) return;
            const currentRoutine = routines[activeTabId];
            currentRoutine.exercises.forEach(ex => {
                localStorage.removeItem(`ex-clock-time-${ex.id}`);
                exerciseClockStates[ex.id] = { time: 0, running: false };
                for (let s = 1; s <= ex.sets; s++) {
                    localStorage.removeItem(`cur-${ex.id}-w-${s}`);
                    localStorage.removeItem(`cur-${ex.id}-r-${s}`);
                }
            });
            renderApp();
        }

        function finishWorkout() {
            clearInterval(globalTimerInterval);
            const currentRoutine = routines[activeTabId];
            const userBw = parseFloat(localStorage.getItem('user_bodyweight')) || 80;

            let logDetails = '';
            let parsedSessionScoreTotal = 0;
            let rawAbsoluteWeightVolumeSum = 0;
            let loggedCount = 0;

            logDetails += `Session Total Duration: ${document.getElementById('global-timer-box').innerText}\n\n`;

            currentRoutine.exercises.forEach(ex => {
                let exLines = [];
                let exerciseVolumeLoad = 0;
                let holdsTotalSeconds = 0;
                const trackingClockText = document.getElementById(`clock-${ex.id}`).innerText;
                
                for (let s = 1; s <= ex.sets; s++) {
                    const weight = localStorage.getItem(`cur-${ex.id}-w-${s}`) || '0';
                    const reps = localStorage.getItem(`cur-${ex.id}-r-${s}`) || '0';
                    
                    if (parseInt(reps) > 0) {
                        exLines.push(`  Set ${s}: ${ex.type === 'hold' ? '' : weight + 'kg x '}${reps} ${ex.type === 'hold' ? 'seconds' : 'reps'}`);
                        if (ex.type === 'hold') {
                            holdsTotalSeconds += parseInt(reps);
                        } else {
                            exerciseVolumeLoad += (parseFloat(weight) * parseInt(reps));
                            rawAbsoluteWeightVolumeSum += (parseFloat(weight) * parseInt(reps));
                        }
                        loggedCount++;
                    }
                }
                
                if (exLines.length > 0) {
                    let finalExScore = ex.type === 'hold' ? (holdsTotalSeconds / 10) : (exerciseVolumeLoad / userBw);
                    parsedSessionScoreTotal += finalExScore;

                    // Evaluate and check if this beats All-Time Best historical metrics cache
                    let pastPb = parseFloat(localStorage.getItem(`pb-score-${ex.id}`)) || 0;
                    if (finalExScore > pastPb) {
                        localStorage.setItem(`pb-score-${ex.id}`, finalExScore.toFixed(1));
                    }

                    logDetails += `${ex.name} (Duration: ${trackingClockText} | Score: ${finalExScore.toFixed(1)}x BW)\n${exLines.join('\n')}\n\n`;
                }
            });

            if (loggedCount === 0) {
                alert("Please log track sets before closing session!");
                return;
            }

            const finalRecordedDayRatio = parsedSessionScoreTotal.toFixed(1);
            const today = new Date();
            const dateString = today.toLocaleDateString(undefined, {month: 'short', day: 'numeric', year: 'numeric'});

            const sessionRecord = {
                date: dateString,
                timestamp: Date.now(),
                type: currentRoutine.name,
                volume: rawAbsoluteWeightVolumeSum,
                ratio: parseFloat(finalRecordedDayRatio),
                details: logDetails.trim()
            };

            let historyList = JSON.parse(localStorage.getItem('gym_history_stream')) || [];
            historyList.unshift(sessionRecord);
            localStorage.setItem('gym_history_stream', JSON.stringify(historyList));

            currentRoutine.exercises.forEach(ex => {
                localStorage.removeItem(`ex-clock-time-${ex.id}`);
                delete exerciseClockStates[ex.id];
                for (let s = 1; s <= ex.sets; s++) {
                    localStorage.removeItem(`cur-${ex.id}-w-${s}`);
                    localStorage.removeItem(`cur-${ex.id}-r-${s}`);
                }
            });

            sessionIsRunning = false;
            document.getElementById('session-gate').style.display = 'block';
            document.getElementById('global-timer-box').style.display = 'none';
            
            alert(`Workout logged! Efficiency Multiplier: ${finalRecordedDayRatio}x BW.`);
            renderApp();
            switchWorkout('view-history');
        }

        function updateDashboardStats() {
            const historyList = JSON.parse(localStorage.getItem('gym_history_stream')) || [];
            document.getElementById('stat-count').innerText = historyList.length;

            if(historyList.length > 0) {
                document.getElementById('stat-last-ratio').innerText = historyList[0].ratio.toFixed(1) + 'x';
            } else {
                document.getElementById('stat-last-ratio').innerText = '0.0x';
            }

            // Rolling 7-Day Cumulative Efficiency Score calculation
            const sevenDaysAgo = Date.now() - (7 * 24 * 60 * 60 * 1000);
            const recentSessions = historyList.filter(s => s.timestamp >= sevenDaysAgo);
            const weeklyScoreSum = recentSessions.reduce((acc, curr) => acc + (curr.ratio || 0), 0);
            
            document.getElementById('stat-week-ratio').innerText = weeklyScoreSum.toFixed(1) + 'x';

            const analyticsBox = document.getElementById('weekly-analytics-panel');
            if(analyticsBox) {
                analyticsBox.innerHTML = `
                    <div class="analytics-block">
                        <div class="analytics-title">📊 Rolling 7-Day Cumulative Microcycle Efficiency</div>
                        Completed Workouts: <strong>${recentSessions.length}</strong><br>
                        Total Weekly Combined Efficiency Profile: <strong>${weeklyScoreSum.toFixed(1)}x</strong> your body weight cleared this week.
                    </div>
                `;
            }
        }

        function renderHistoryLog() {
            const historyStream = document.getElementById('history-stream');
            const historyList = JSON.parse(localStorage.getItem('gym_history_stream')) || [];

            if (historyList.length === 0) {
                historyStream.innerHTML = "No training sessions recorded yet.";
                return;
            }

            let html = '';
            historyList.forEach(item => {
                html += `
                    <div class="history-item">
                        <span class="history-date">${item.date}</span> - <span style="color: var(--accent-color); font-weight:bold;">${item.type}</span> 
                        <span style="color: var(--success-color); font-weight:bold; margin-left:10px;">(Efficiency Score: ${item.ratio.toFixed(1)}x BW)</span>
                        <div class="history-details">${item.details}</div>
                    </div>
                `;
            });
            historyStream.innerHTML = html;
        }

        function exportDataData() {
            const stateData = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                stateData[key] = localStorage.getItem(key);
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(stateData));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `gym_tracker_v6_backup.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importDataData(event) {
            const fileElement = event.target.files[0];
            if (!fileElement) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const parsed = JSON.parse(e.target.result);
                Object.keys(parsed).forEach(k => { localStorage.setItem(k, parsed[k]); });
                alert("Analytics restored seamlessly!");
                renderApp();
            };
            reader.readAsText(fileElement);
        }

        function resetAllHistory() {
            if (confirm("Reset everything?")) {
                localStorage.clear();
                location.reload();
            }
        }

        renderApp();
    </script>
</body>
</html>
